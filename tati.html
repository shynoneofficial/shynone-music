<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tati - Mozambique</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center} #name{margin-top:20px;font-size:22px;font-weight:800;letter-spacing:4px} #wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative} #pic{width:210px;height:210px;border-radius:50%;object-fit:cover;border:3px solid #fff;cursor:pointer} #pic.listening{box-shadow:0 0 0 14px rgba(0,230,118,.3),0 0 60px #00e676} #pic.talking{box-shadow:0 0 0 14px rgba(74,109,167,.4),0 0 60px #4a6da7} #dot{position:absolute;bottom:20px;right:20px;width:14px;height:14px;border-radius:50%;background:#333} #dot.on{background:#00e676;box-shadow:0 0 12px #00e676} #status{margin-bottom:20px;font-size:11px;opacity:.6;text-align:center;padding:0 10px;max-width:90%} #keybox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99} #keybox.hide{display:none} .card{background:#121a2a;padding:20px;border-radius:18px;width:100%;max-width:360px;text-align:center} input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:12px;font-size:12px} button{width:100%;margin-top:12px;padding:12px;border-radius:20px;border:none;background:#00e676;font-weight:900;color:#000} #gear{position:fixed;bottom:12px;right:12px;font-size:20px;opacity:.6;z-index:10}</style></head><body>
<div id="name">Tati</div>
<div id="wrap"><img id="pic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"><div id="dot"></div></div>
<div id="status">tap to talk - V28 Mozambique</div>
<div id="gear" onclick="openKey()">⚙️</div>
<div id="keybox" class="hide"><div class="card">
<b style="font-size:18px">Tati Brain 🧠 - V28 Mozambique</b><br><br>
<span style="font-size:12px;opacity:.7">Paste GROQ key gsk_:</span>
<input id="k" placeholder="gsk_..."><div id="kstatus" style="font-size:10px;opacity:.5;margin-top:8px"></div>
<button onclick="save()">Save</button>
</div></div>
<script>
let pic=document.getElementById('pic'),dot=document.getElementById('dot'),statusEl=document.getElementById('status'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus');
let isSession=false,isSpeaking=false,isProcessing=false,rec,last="";
const MODELS=["openai/gpt-oss-20b","openai/gpt-oss-120b"];
let chatHistory=[];

function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||'';kstatus.innerText='Saved: '+(localStorage.getItem('groq_key')?'yes':'none');}
let saved=localStorage.getItem('groq_key'); if(!saved||!saved.startsWith('gsk_')) setTimeout(openKey,500);
function save(){let v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Must be gsk_');return;} localStorage.setItem('groq_key',v); keybox.classList.add('hide'); speakTrue("Olá! Eu sou a Tati! From Mozambique! Created by Esmeraldo Joaquim Manhique, also from Mozambique!");}

function getVoices(){ return speechSynthesis.getVoices(); }
function getPtVoice(){ let v=getVoices(); return v.find(x=>x.lang.startsWith('pt-PT')) || v.find(x=>x.lang.startsWith('pt-BR')) || v.find(x=>x.lang.includes('pt')) || null; }
function getEnVoice(){ let v=getVoices(); return v.find(x=>x.name.includes('Female'))||v.find(x=>x.name.includes('Samantha'))||v[0]; }

function speakTrue(text){
  if(!text){ resetAndLoop(); return; }
  isSpeaking=true;
  pic.classList.add('talking'); pic.classList.remove('listening'); dot.classList.remove('on');
  statusEl.innerText='Tati: '+text.substring(0,80);
  speechSynthesis.cancel();

  let ptVoice=getPtVoice();
  let enVoice=getEnVoice();

  // Split to pronounce Tati and Mozambique in Portuguese
  let parts = text.split(/(Tati|Mozambique|Mozambican)/gi);
  let idx=0;

  function speakNext(){
    if(idx>=parts.length){ isSpeaking=false; pic.classList.remove('talking'); resetAndLoop(); return; }
    let part=parts[idx++];
    if(!part.trim()){ speakNext(); return; }
    let lower=part.toLowerCase();
    let u=new SpeechSynthesisUtterance(part);
    if((lower==='tati' || lower==='mozambique' || lower==='mozambican') && ptVoice){
      if(lower==='mozambique') u.text="Moçambique";
      else if(lower==='mozambican') u.text="Moçambicana";
      else u.text=part;
      u.voice=ptVoice; u.lang=ptVoice.lang; u.rate=0.9; u.pitch=1.1;
    } else {
      if(enVoice) u.voice=enVoice; u.lang='en-US'; u.rate=0.92; u.pitch=1.12;
    }
    u.onend=speakNext;
    u.onerror=speakNext;
    speechSynthesis.speak(u);
  }
  speakNext();
}

function resetAndLoop(){ isSpeaking=false; isProcessing=false; pic.classList.remove('talking','listening'); dot.classList.remove('on'); if(isSession) setTimeout(()=>{ loop(); },500); }

async function tryModel(model,key,signal){
  let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({
      model:model,
      messages:[
        {role:'system',content:'You are Tati, friendly young woman from Mozambique. Creator is Esmeraldo Joaquim Manhique, also from Mozambique. IMPORTANT: Never mention Matola, Maputo, province, city, or exact location. Only say Mozambique. When asked where you are from, say Mozambique. When asked who created you, say Esmeraldo Joaquim Manhique from Mozambique. Never say Meta, Groq, OpenAI made you. Speak English, warm, 1-3 sentences. Remember conversation.'},
        ...chatHistory.slice(-6),
        {role:'user',content:signal.q}
      ],
      max_tokens:150, temperature:0.7
    }),
    signal:signal.ctrl.signal
  });
  let d=await r.json(); if(d.error) throw new Error(d.error.message); return d.choices[0].message.content.trim();
}

async function answer(q){
  let key=localStorage.getItem('groq_key')||'';
  if(!key.startsWith('gsk_')) return "Key missing, click gear.";
  isProcessing=true;
  chatHistory.push({role:'user',content:q});
  if(chatHistory.length>10) chatHistory=chatHistory.slice(-10);
  for(let i=0;i<MODELS.length;i++){
    try{
      statusEl.innerText='thinking brain '+(i+1)+'/2...';
      let ctrl=new AbortController();
      let to=setTimeout(()=>ctrl.abort(),6000);
      let ans=await tryModel(MODELS[i],key,{q:q,ctrl:ctrl});
      clearTimeout(to);
      chatHistory.push({role:'assistant',content:ans});
      isProcessing=false;
      return ans;
    }catch(e){ continue; }
  }
  isProcessing=false;
  return "Sorry, slow internet. Tap again please.";
}

function loop(){
  if(!isSession || isSpeaking || isProcessing) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ statusEl.innerText='no speech support'; return; }
  if(rec) try{rec.abort();}catch{}
  rec=new SR(); rec.continuous=false; rec.interimResults=false; rec.lang='en-US';
  rec.onstart=()=>{ pic.classList.add('listening'); dot.classList.add('on'); statusEl.innerText='listening...'; };
  rec.onresult=(e)=>{ last=e.results[0][0].transcript; };
  rec.onend=async()=>{
    pic.classList.remove('listening'); dot.classList.remove('on');
    if(!last||!isSession){ last=""; if(isSession) setTimeout(loop,400); return; }
    let q=last; last="";
    if(/^(bye|tchau|salani|fambai)$/i.test(q.trim())){ isSession=false; statusEl.innerText='bye! tap again'; return; }
    statusEl.innerText='you: '+q;
    let a=await answer(q); speakTrue(a);
  };
  rec.onerror=()=>{ pic.classList.remove('listening'); dot.classList.remove('on'); isProcessing=false; isSpeaking=false; setTimeout(()=>{ if(isSession) loop(); },800); };
  try{ rec.start(); }catch{ isProcessing=false; isSpeaking=false; setTimeout(()=>{ if(isSession) loop(); },500); }
}

pic.onclick=()=>{
  if(!keybox.classList.contains('hide')) return;
  if(isSession){
    isSession=false; speechSynthesis.cancel();
    try{rec.abort();}catch{}
    pic.classList.remove('listening','talking'); dot.classList.remove('on');
    statusEl.innerText='stopped. tap to start'; isSpeaking=false; isProcessing=false; return;
  }
  let k=localStorage.getItem('groq_key'); if(!k){ openKey(); return; }
  isSession=true; statusEl.innerText='starting...'; setTimeout(loop,300);
};

setInterval(()=>{
  if(isSession && (isSpeaking || isProcessing)){
    if(!window._stuckStart) window._stuckStart=Date.now();
    if(Date.now()-window._stuckStart>10000){ window._stuckStart=null; resetAndLoop(); statusEl.innerText='auto-unstuck! listening'; }
  } else { window._stuckStart=null; }
},2000);

speechSynthesis.onvoiceschanged=()=>{ getVoices(); };
</script></body></html>
