<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TATI</title>
<style>
html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pic{width:210px;height:210px;border-radius:50%;object-fit:cover;border:3px solid #fff;cursor:pointer;transition:.3s;box-shadow:0 0 30px rgba(255,255,255,.15)}
#pic.listening{box-shadow:0 0 0 16px rgba(0,230,118,.2),0 0 60px rgba(0,230,118,.5);transform:scale(1.05)}
#pic.talking{box-shadow:0 0 0 16px rgba(255,255,255,.15),0 0 50px rgba(255,255,255,.3);transform:scale(1.03)}
#dot{position:absolute;bottom:12px;right:12px;width:16px;height:16px;border-radius:50%;background:#00e676;border:2px solid #000;display:none}
#dot.on{display:block}
#wrap{position:relative}
#settings{position:fixed;bottom:14px;right:14px;opacity:.15;font-size:10px;color:#fff;cursor:pointer}
#settings:hover{opacity:.6}
</style></head><body>

<div id="wrap">
<img id="pic" src="./Tate.jpg" alt="TATI" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop&crop=face'">
<div id="dot"></div>
</div>

<div id="settings" onclick="document.getElementById('panel').style.display='block'">⚙️</div>

<div id="panel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:20px">
<div style="background:#111a2a;padding:16px;border-radius:14px;width:100%;max-width:380px;color:#fff;font-family:system-ui;font-size:12px">
<b>Change Voice (hidden)</b><br><br>
<select id="voiceChoice" style="width:100%;padding:8px;border-radius:8px;background:#000;color:#fff;border:1px solid #333">
<option value="female" selected>Female African - Natural (System)</option>
<option value="taiwo">Taiwo - Real African Female (Needs free key)</option>
</select>
<input id="apiKey" placeholder="ElevenLabs free key (optional)" style="width:100%;padding:8px;border-radius:8px;background:#000;color:#fff;border:1px solid #333;margin-top:8px">
<div style="margin-top:10px;display:flex;gap:8px">
<button onclick="test()" style="flex:1;padding:8px;border-radius:20px;border:none;background:#00e676;font-weight:700">Test</button>
<button onclick="document.getElementById('panel').style.display='none'" style="flex:1;padding:8px;border-radius:20px;border:none;background:#333;color:#fff">Close</button>
</div>
<div style="font-size:10px;opacity:.5;margin-top:8px">Your picture: put Tate.jpg in same folder as tati.html. No avatar drawing.</div>
</div>
</div>

<script>
let pic=document.getElementById('pic'), dot=document.getElementById('dot'), voiceChoice=document.getElementById('voiceChoice'), apiKeyInput=document.getElementById('apiKey');
let isSession=false, isSpeaking=false, recognition, lastText="";

apiKeyInput.value=localStorage.getItem('eleven_key')||'';
voiceChoice.value=localStorage.getItem('voice_choice')||'female';
apiKeyInput.oninput=()=>localStorage.setItem('eleven_key',apiKeyInput.value.trim());
voiceChoice.onchange=()=>localStorage.setItem('voice_choice',voiceChoice.value);

function getFemaleVoice(){
  let voices=speechSynthesis.getVoices();
  // FORCE FEMALE - no male
  let female = voices.find(v=>v.name.toLowerCase().includes('female') && v.lang.startsWith('en-')) ||
               voices.find(v=>v.name.includes('Samantha')) ||
               voices.find(v=>v.name.includes('Google UK English Female')) ||
               voices.find(v=>v.name.includes('Zira')) ||
               voices.find(v=>v.lang==='en-ZA' && v.name.toLowerCase().includes('female')) ||
               voices.find(v=>v.lang==='en-ZA') ||
               voices.find(v=>v.lang==='en-US' && !v.name.toLowerCase().includes('male')) ||
               voices[0];
  return female;
}

async function speak(text){
  if(!text) return;
  isSpeaking=true;
  pic.classList.add('talking'); pic.classList.remove('listening');
  dot.classList.add('on');
  dot.style.background='#4a6da7';

  let choice=voiceChoice.value, key=apiKeyInput.value.trim();
  if(choice==='taiwo' && key){
    try{
      let res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/RAVWJW17BPoSIf05iXxf`,{
        method:'POST', headers:{'Content-Type':'application/json','xi-api-key':key},
        body:JSON.stringify({text, model_id:'eleven_multilingual_v2', voice_settings:{stability:0.7, similarity_boost:0.85}})
      });
      if(!res.ok) throw 0;
      let blob=await res.blob();
      let audio=new Audio(URL.createObjectURL(blob));
      audio.onended=()=>{isSpeaking=false; pic.classList.remove('talking'); dot.style.background='#00e676'; if(isSession) setTimeout(startLoop,400); };
      audio.play(); return;
    }catch{}
  }
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  let v=getFemaleVoice();
  if(v) u.voice=v;
  u.rate=0.92; u.pitch=1.15; // female higher
  u.onend=()=>{isSpeaking=false; pic.classList.remove('talking'); dot.style.background='#00e676'; if(isSession) setTimeout(startLoop,500); };
  speechSynthesis.speak(u);
}

function test(){ speak("mhm"); }

function humanReply(t){
  let l=t.toLowerCase();
  if(/(bye|tchau|xobye|fambai|salani|chega)$/i.test(l.trim())){
    isSession=false;
    pic.classList.remove('listening','talking'); dot.classList.remove('on');
    return null; // end silently - no long bye speech
  }
  // Only short listener sounds - no sentences
  const sounds=["mhm","mhm mhm","yeah","and then?","wow...","really?","eeh"];
  // If emergency long, still just mhm until user stops
  return sounds[Math.floor(Math.random()*sounds.length)];
}

function startLoop(){
  if(!isSession || isSpeaking) return;
  const SR=window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  recognition=new SR(); recognition.continuous=false; recognition.interimResults=false; recognition.lang='en-US';
  recognition.onstart=()=>{ pic.classList.add('listening'); dot.classList.add('on'); dot.style.background='#00e676'; };
  recognition.onresult=(e)=>{ lastText=e.results[0][0].transcript; };
  recognition.onend=()=>{
    pic.classList.remove('listening');
    if(!lastText){ if(isSession) setTimeout(startLoop,300); return; }
    let reply=humanReply(lastText);
    lastText="";
    if(reply===null) return; // ended
    if(reply) speak(reply); else if(isSession) setTimeout(startLoop,300);
  };
  recognition.onerror=()=>{ if(isSession) setTimeout(startLoop,700); };
  try{recognition.start();}catch{setTimeout(startLoop,300);}
}

pic.onclick=()=>{
  if(isSession){
    isSession=false;
    speechSynthesis.cancel();
    try{recognition.stop();}catch{}
    pic.classList.remove('listening','talking'); dot.classList.remove('on');
    return;
  }
  isSession=true;
  // NO INTRO SPEECH - just start listening immediately like human
  dot.classList.add('on');
  startLoop();
};

speechSynthesis.onvoiceschanged=()=>{};
</script></body></html>
