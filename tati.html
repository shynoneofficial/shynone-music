<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tati - SHYNONE MUSIC</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a192f">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif}
html,body{height:100%;width:100%;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column}
#header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:6px;border-bottom:1px solid #e9edef;flex-shrink:0;z-index:20;position:relative}
#left{display:flex;align-items:center}
#avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #00a884}
#centerLogo{flex:1;text-align:center;cursor:pointer}
#centerLogo b{font-weight:900;font-size:15px;letter-spacing:1px;color:#0a192f;display:block}
#centerLogo i{font-style:normal;font-size:8px;letter-spacing:2.5px;color:#00a884;font-weight:700;display:block;margin-top:1px}
#right{display:flex;align-items:center;gap:6px}
#langSwitch{display:flex;gap:2px;background:#f0f2f5;padding:3px;border-radius:20px}
.langBtn{padding:6px 9px;border-radius:15px;border:none;font-size:10px;font-weight:800;cursor:pointer;background:transparent;color:#667781;min-width:32px;-webkit-tap-highlight-color:transparent}
.langBtn.active{background:#0a192f;color:#fff}
#menuBtn{font-size:22px;cursor:pointer;padding:6px;color:#54656f}
#dropdown{position:absolute;top:60px;right:8px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:250px;display:none;flex-direction:column;overflow:hidden;z-index:50}
#dropdown.show{display:flex}
.dropItem{padding:14px;font-size:13px;color:#111b21;cursor:pointer;border-bottom:1px solid #f0f2f5}
.dropItem:active{background:#eef1f5}
#modeSwitch{display:flex;background:#f0f2f5;padding:4px;margin:8px;border-radius:10px;gap:4px;flex-shrink:0}
.modeBtn{flex:1;padding:11px;border-radius:8px;border:none;font-weight:800;font-size:12px;cursor:pointer;background:transparent;color:#667781;-webkit-tap-highlight-color:transparent}
.modeBtn.active{background:#0a192f;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#chat{flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:5px;background-color:#f6f3ee;background-image:linear-gradient(rgba(246,243,238,.90), rgba(238,241,245,.93)), url('https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=800&q=80&auto=format&fit=crop');background-size:cover;background-position:center}
#voiceView{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#142a4a 0%,#0a192f 45%,#040c18 100%);padding:20px;gap:20px;position:relative}
#voiceView.show{display:flex}
#bigPic{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid #00a884;z-index:1}
#bigPic.talking{box-shadow:0 0 0 14px rgba(0,168,132,.25),0 0 60px #00a884;transform:scale(1.05)}
#bigPic.listening{box-shadow:0 0 0 14px rgba(241,92,109,.25),0 0 60px #f15c6d;transform:scale(1.05)}
#voiceStatus{color:#d1d7db;font-size:13px;text-align:center;z-index:1;min-height:36px}
#voiceBtnBig{width:70px;height:70px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:28px;cursor:pointer;z-index:1}
#voiceBtnBig.listening{background:#f15c6d;animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.bubble{max-width:78%;padding:9px 11px 7px;border-radius:12px;font-size:14px;line-height:19px;position:relative;word-wrap:break-word;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.user{align-self:flex-end;background:#d9fdd3;border-top-right-radius:3px}
.tati{align-self:flex-start;background:rgba(255,255,255,.97);border-top-left-radius:3px}
.time{font-size:10px;color:#667781;float:right;margin-left:8px;margin-top:4px}
.err{align-self:center;background:#fff3cd;color:#664d00;font-size:11px;padding:6px 10px;border-radius:16px}
#inputArea{flex-shrink:0;background:#f0f2f5;padding:7px;display:flex;align-items:flex-end;gap:6px;padding-bottom:max(7px, env(safe-area-inset-bottom))}
#textBox{flex:1;background:#fff;border-radius:22px;padding:8px 12px;display:flex;min-height:42px}
#textInput{flex:1;border:none;outline:none;font-size:14px;background:transparent;resize:none;max-height:90px}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:#0a192f;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
#keybox{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#keybox.hide{display:none!important}
.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);width:100%;max-width:350px;text-align:center}
.kinput{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:10px;font-size:13px}
.kbtn{width:100%;margin-top:10px;padding:11px;border-radius:8px;border:none;background:#0a192f;color:#fff;font-weight:700;cursor:pointer}
.kbtn.sec{background:#f0f2f5;color:#111}
</style></head><body>
<div id="header">
<div id="left"><img id="avatar" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"></div>
<div id="centerLogo"><b>SHYNONE</b><i>MUSIC</i></div>
<div id="right">
<div id="langSwitch">
<button class="langBtn active" data-lang="en">EN</button>
<button class="langBtn" data-lang="pt">PT</button>
<button class="langBtn" data-lang="ch">CH</button>
</div>
<div id="menuBtn">⋮</div>
</div>
<div id="dropdown">
<div class="dropItem" id="buyBtn">🎵 Buy Music - M-Pesa 84 033 1635</div>
<div class="dropItem" id="settingsBtn">⚙️ Settings - Groq Key</div>
</div>
</div>

<div id="modeSwitch">
<button id="btnText" class="modeBtn active">💬 Text</button>
<button id="btnVoice" class="modeBtn">🎤 Voice</button>
</div>

<div id="chat"></div>
<div id="voiceView">
<img id="bigPic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'">
<div id="voiceStatus">Tap mic to talk</div>
<button id="voiceBtnBig">🎤</button>
</div>

<div id="inputArea">
<div id="textBox"><textarea id="textInput" placeholder="Message"></textarea></div>
<button id="sendBtn">➤</button>
</div>

<div id="keybox" class="hide"><div class="card">
<b>Settings</b><br><span style="font-size:11px;color:#667781">Add Groq key (only first time)</span><br>
<input id="k" class="kinput" placeholder="Paste gsk_...">
<div id="kstatus" style="font-size:10px;color:#667781;margin-top:6px"></div>
<button class="kbtn" id="saveKeyBtn">Save & Start</button>
<button class="kbtn sec" id="testKeyBtn">Test Key</button>
<div id="testRes" style="font-size:10px;margin-top:8px;text-align:left;max-height:70px;overflow:auto;background:#f5f6f6;padding:8px;border-radius:6px;display:none"></div>
<button class="kbtn sec" id="closeKeyBtn">Continue Without Key</button>
</div></div>

<script>
var chatEl=document.getElementById('chat'),voiceView=document.getElementById('voiceView'),textInput=document.getElementById('textInput'),inputArea=document.getElementById('inputArea'),btnText=document.getElementById('btnText'),btnVoice=document.getElementById('btnVoice'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus'),testRes=document.getElementById('testRes'),bigPic=document.getElementById('bigPic'),voiceStatus=document.getElementById('voiceStatus'),voiceBtnBig=document.getElementById('voiceBtnBig'),dropdown=document.getElementById('dropdown'),menuBtn=document.getElementById('menuBtn');
var rec=null,isListening=false,isSpeaking=false,chatHistory=[],mode='text',lang='en';

var LANGS={
 en:{ph:'Message Tati...',textMode:'💬 Text',voiceMode:'🎤 Voice',intro:'Hi! I\'m Tati from SHYNONE MUSIC 🇲🇿<br><br>We are #1 for Mozambican music!<br>🎵 Buy via M-Pesa 84 033 1635 / eMola 86 940 1491<br><br>💬 Text = text only<br>🎤 Voice = voice only',voiceIdle:'Voice mode<br>Tap mic - I will talk',listening:'Listening...',thinking:'Thinking...',sys:'You are Tati from SHYNONE MUSIC, Mozambique. #1 platform. Buy via M-Pesa 84 033 1635 eMola 86 940 1491. Creator Esmeraldo Joaquim Manhique, only mention when asked. Only Mozambique. Speak English warm, 1-2 sentences.'},
 pt:{ph:'Mensagem para Tati...',textMode:'💬 Texto',voiceMode:'🎤 Voz',intro:'Olá! Eu sou a Tati da SHYNONE MUSIC 🇲🇿<br><br>Somos #1 para música Moçambicana!<br>🎵 Compra via M-Pesa 84 033 1635 / eMola 86 940 1491<br><br>💬 Texto = só texto<br>🎤 Voz = só voz',voiceIdle:'Modo de voz<br>Toque no microfone',listening:'Ouvindo...',thinking:'Pensando...',sys:'Você é a Tati da SHYNONE MUSIC, Moçambique. #1 para música Moçambicana. Compra via M-Pesa 84 033 1635 eMola 86 940 1491. Criador Esmeraldo Joaquim Manhique, só quando perguntarem. Só Moçambique. Fale Português de Moçambique, 1-2 frases.'},
 ch:{ph:'Tsalela Tati...',textMode:'💬 Ku Tsala',voiceMode:'🎤 Ku Vulavula',intro:'Avuxeni! Hi mina Tati wa SHYNONE MUSIC 🇲🇿<br><br>Hi hina #1 ya vunanga bya Mozambique!<br>🎵 Xava hi M-Pesa 84 033 1635 / eMola 86 940 1491<br><br>💬 Ku Tsala = ku tsala ntsena<br>🎤 Ku Vulavula = ku vulavula ntsena',voiceIdle:'Ku Vulavula<br>Tsindza mic',listening:'Ndzi ya ku yingisa...',thinking:'Ndzi ehleketa...',sys:'You are Tati from SHYNONE MUSIC, Mozambique. Speak Changana (Xichangana). Use Avuxeni, Injani, Ndza nkhensa, Hi famba kahle. Mix with Portuguese if needed. #1 for music. Buy via M-Pesa 84 033 1635 eMola 86 940 1491. Creator Esmeraldo Joaquim Manhique, only when asked. Only Mozambique. Speak mostly Changana, warm, 1-2 sentences.'}
};

function setLang(l){
 console.log('LANG',l);
 lang=l; localStorage.setItem('tati_lang',l);
 document.querySelectorAll('.langBtn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===l);});
 var t=LANGS[l]; textInput.placeholder=t.ph; btnText.textContent=t.textMode; btnVoice.textContent=t.voiceMode;
 chatEl.innerHTML=''; addBubble(t.intro,'tati'); voiceStatus.innerHTML=t.voiceIdle; chatHistory=[];
}
function setMode(m){
 console.log('MODE',m);
 mode=m;
 if(m==='text'){btnText.classList.add('active'); btnVoice.classList.remove('active'); chatEl.style.display='flex'; voiceView.classList.remove('show'); inputArea.style.display='flex'; try{speechSynthesis.cancel();}catch(e){} isSpeaking=false; bigPic.classList.remove('talking','listening');}
 else{btnVoice.classList.add('active'); btnText.classList.remove('active'); chatEl.style.display='none'; voiceView.classList.add('show'); inputArea.style.display='none'; voiceStatus.innerHTML=LANGS[lang].voiceIdle;}
}

function init(){
 // Language buttons
 document.querySelectorAll('.langBtn').forEach(btn=>{
  btn.onclick=function(){ setLang(this.dataset.lang); };
 });
 btnText.onclick=function(){ setMode('text'); };
 btnVoice.onclick=function(){ setMode('voice'); };
 menuBtn.onclick=function(e){ e.stopPropagation(); dropdown.classList.toggle('show'); };
 document.getElementById('buyBtn').onclick=function(){ dropdown.classList.remove('show'); if(confirm('🎵 Buy Music\nM-Pesa: 84 033 1635\neMola: 86 940 1491\n\nOpen SHYNONE MUSIC?')) window.open('https://shynoneofficial.github.io/shynone-music/','_blank'); };
 document.getElementById('settingsBtn').onclick=function(){ dropdown.classList.remove('show'); openKey(); };
 document.getElementById('centerLogo').onclick=function(){ window.open('https://shynoneofficial.github.io/shynone-music/','_blank'); };
 document.getElementById('saveKeyBtn').onclick=function(){ var v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Must start with gsk_');return;} localStorage.setItem('groq_key',v); keybox.classList.add('hide'); addBubble('Key saved ✓ Ready!','tati'); };
 document.getElementById('closeKeyBtn').onclick=function(){ keybox.classList.add('hide'); };
 document.getElementById('testKeyBtn').onclick=async function(){
  var key=kinput.value.trim()||localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){testRes.style.display='block';testRes.textContent='No key';return;} testRes.style.display='block'; testRes.textContent='Testing...'; try{var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'user',content:'hi'}],max_tokens:5})}); var d=await r.json(); testRes.textContent=d.error?'❌ '+d.error.message:'✅ Key works!';}catch(e){testRes.textContent='❌ '+e.message;}
 };
 document.getElementById('sendBtn').onclick=function(){ sendText(); };
 textInput.addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,90)+'px'; });
 textInput.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendText(); }});
 voiceBtnBig.onclick=function(){ tapVoice(); };
 document.addEventListener('click',function(e){ if(!e.target.closest('#header')) dropdown.classList.remove('show'); });
 
 // Start
 var savedLang=localStorage.getItem('tati_lang')||'en'; setLang(savedLang); setMode('text');
 // Only show keybox if no key at all, and allow continue
 var existingKey=localStorage.getItem('groq_key'); if(!existingKey||!existingKey.startsWith('gsk_')){ setTimeout(function(){ keybox.classList.remove('hide'); },800); }
}

function addBubble(text,type){var b=document.createElement('div'); b.className='bubble '+type; var d=new Date(); var tm=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); b.innerHTML=text+'<span class="time">'+tm+'</span>'; chatEl.appendChild(b); chatEl.scrollTop=chatEl.scrollHeight;}
function getVoice(){var v=speechSynthesis.getVoices(); if(lang==='pt'||lang==='ch') return v.find(function(x){return x.lang.indexOf('pt')===0;})||v[0]; return v.find(function(x){return x.lang.indexOf('en')===0;})||v[0];}
function speak(text,cb){if(!text){if(cb)cb();return;} isSpeaking=true; bigPic.classList.add('talking'); voiceStatus.textContent=LANGS[lang].thinking; try{speechSynthesis.cancel();}catch(e){} setTimeout(function(){var vo=getVoice(); var u=new SpeechSynthesisUtterance(text); if(vo) u.voice=vo; u.rate=0.92; u.onend=function(){isSpeaking=false; bigPic.classList.remove('talking'); voiceStatus.innerHTML=LANGS[lang].voiceIdle; if(cb)cb();}; u.onerror=function(){isSpeaking=false; bigPic.classList.remove('talking'); if(cb)cb();}; speechSynthesis.speak(u);},100);}
async function askGroq(q){var key=localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){addBubble('⚙️ Tap ⋮ > Settings to add Groq key','err'); openKey(); return null;} chatHistory.push({role:'user',content:q}); if(chatHistory.length>12) chatHistory=chatHistory.slice(-12); try{var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'system',content:LANGS[lang].sys},...chatHistory.slice(-6),{role:'user',content:q}],max_tokens:160,temperature:0.7})}); var d=await r.json(); if(d.error){addBubble('❌ '+d.error.message,'err');return null;} var ans=d.choices[0].message.content.trim(); chatHistory.push({role:'assistant',content:ans}); return ans;}catch(e){addBubble('❌ Network: '+e.message,'err');return null;}}
async function sendText(){var q=textInput.value.trim(); if(!q) return; addBubble(q,'user'); textInput.value=''; textInput.style.height='auto'; var ans=await askGroq(q); if(ans) addBubble(ans,'tati');}
async function tapVoice(){if(isSpeaking){try{speechSynthesis.cancel();}catch(e){} isSpeaking=false; bigPic.classList.remove('talking'); voiceBtnBig.classList.remove('listening'); voiceBtnBig.textContent='🎤'; voiceStatus.innerHTML=LANGS[lang].voiceIdle; return;} if(isListening) return; var key=localStorage.getItem('groq_key'); if(!key||!key.startsWith('gsk_')){openKey();return;} var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){voiceStatus.innerHTML='Voice not supported<br>Use Text'; return;} isListening=true; voiceBtnBig.classList.add('listening'); voiceBtnBig.textContent='🔴'; bigPic.classList.add('listening'); voiceStatus.textContent=LANGS[lang].listening; if(rec) try{rec.abort();}catch(e){} rec=new SR(); rec.continuous=false; rec.interimResults=false; rec.lang=(lang==='pt'||lang==='ch')?'pt-PT':'en-US'; var heard=''; rec.onresult=function(e){heard=e.results[0][0].transcript;}; rec.onend=async function(){isListening=false; voiceBtnBig.classList.remove('listening'); voiceBtnBig.textContent='🎤'; bigPic.classList.remove('listening'); if(!heard){voiceStatus.innerHTML=lang==='ch'?'A ndzi ku twanga<br>Tsindza nakambe':lang==='pt'?'Não ouvi<br>Toque novamente':'Did not hear<br>Tap again';return;} voiceStatus.textContent=LANGS[lang].thinking+' "'+heard+'"'; var ans=await askGroq(heard); if(ans){voiceStatus.textContent=ans; speak(ans);} else voiceStatus.innerHTML=LANGS[lang].voiceIdle;}; rec.onerror=function(e){isListening=false; voiceBtnBig.classList.remove('listening'); voiceBtnBig.textContent='🎤'; bigPic.classList.remove('listening'); voiceStatus.innerHTML='Mic error: '+e.error+'<br>Tap again';}; try{rec.start();}catch(e){isListening=false; voiceBtnBig.classList.remove('listening'); voiceBtnBig.textContent='🎤';}}
function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||'';kstatus.textContent=localStorage.getItem('groq_key')?'Saved ✓':'No key yet';}

document.addEventListener('DOMContentLoaded',init);
</script></body></html>
