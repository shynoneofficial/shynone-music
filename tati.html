<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tati</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center} #name{margin-top:20px;font-size:22px;font-weight:800;letter-spacing:4px} #wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative} #pic{width:210px;height:210px;border-radius:50%;object-fit:cover;border:3px solid #fff;cursor:pointer} #pic.listening{box-shadow:0 0 0 14px rgba(0,230,118,.3),0 0 60px #00e676} #pic.talking{box-shadow:0 0 0 14px rgba(74,109,167,.4),0 0 60px #4a6da7} #dot{position:absolute;bottom:20px;right:20px;width:14px;height:14px;border-radius:50%;background:#333} #dot.on{background:#00e676;box-shadow:0 0 12px #00e676} #status{margin-bottom:20px;font-size:11px;opacity:.6;text-align:center;padding:0 10px} #keybox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99} #keybox.hide{display:none} .card{background:#121a2a;padding:20px;border-radius:18px;width:100%;max-width:360px;text-align:center} input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:12px;font-size:12px} button{width:100%;margin-top:12px;padding:12px;border-radius:20px;border:none;background:#00e676;font-weight:900;color:#000} #gear{position:fixed;bottom:12px;right:12px;font-size:20px;opacity:.6;z-index:10}</style></head><body>
<div id="name">Tati</div>
<div id="wrap"><img id="pic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"><div id="dot"></div></div>
<div id="status">tap to talk</div>
<div id="gear" onclick="openKey()">⚙️</div>

<div id="keybox" class="hide"><div class="card">
<b style="font-size:18px">Tati Brain 🧠</b><br><br>
<span style="font-size:12px;opacity:.7">Paste your GROQ key here (starts with gsk_):</span>
<input id="k" placeholder="gsk_... paste here">
<div id="kstatus" style="font-size:10px;opacity:.5;margin-top:8px"></div>
<button onclick="save()">Save & Close</button>
<button onclick="clearKey()" style="background:#333;color:#fff;margin-top:8px">Clear Key</button>
</div></div>

<script>
let pic=document.getElementById('pic'),dot=document.getElementById('dot'),statusEl=document.getElementById('status'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus');
let isSession=false,isSpeaking=false,isProcessing=false,rec,last="",lock=false;
function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||'';kstatus.innerText='Current: '+(localStorage.getItem('groq_key')?localStorage.getItem('groq_key').substring(0,12)+'... saved':'none');}
function clearKey(){localStorage.removeItem('groq_key');kinput.value='';kstatus.innerText='cleared';}
let saved=localStorage.getItem('groq_key');
if(!saved || !saved.startsWith('gsk_')){ setTimeout(openKey,500); } 
function save(){let v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Wrong! Key must start with gsk_  - copy FULL key from groq.com');return;} if(v.length<20){alert('Key too short - you copied only half! Copy again, it is very long');return;} localStorage.setItem('groq_key',v); keybox.classList.add('hide'); speak("Hi! I'm Tati! My brain is online now!"); statusEl.innerText='brain saved! tap to talk';}
function getVoice(){let v=speechSynthesis.getVoices();return v.find(x=>x.name.includes('Female'))||v.find(x=>x.name.includes('Samantha'))||v.find(x=>x.name.includes('Zira'))||v.find(x=>x.lang==='en-US')||v[0];}
function speak(t){if(!t||isSpeaking)return;isSpeaking=true;lock=true;pic.classList.add('talking');pic.classList.remove('listening');dot.classList.remove('on');statusEl.innerText='Tati speaking...';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);let vo=getVoice();if(vo)u.voice=vo;u.lang='en-US';u.rate=0.92;u.pitch=1.15;u.onend=()=>{isSpeaking=false;pic.classList.remove('talking');setTimeout(()=>{lock=false;if(isSession)loop();},600);};speechSynthesis.speak(u);}
async function answer(q){let key=localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')) return "My brain key is missing. Click the gear bottom right and paste your gsk_ key."; try{isProcessing=true;statusEl.innerText='thinking...';let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:'You are Tati, friendly young Mozambican woman from Matola, sister. Speak English only, natural, warm, 1-2 sentences.'},{role:'user',content:q}],max_tokens:120})});let d=await r.json(); if(d.error){ return "Groq error: "+d.error.message+" - check your key in gear."; } return d.choices[0].message.content.trim();}catch(e){return "Sorry, my brain is offline. Error: "+e.message+" . Click gear and re-paste key.";}finally{isProcessing=false;}}
function loop(){if(!isSession||isSpeaking||isProcessing||lock)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(rec)try{rec.abort();}catch{} rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang='en-US';rec.onstart=()=>{pic.classList.add('listening');dot.classList.add('on');statusEl.innerText='listening...';};rec.onresult=(e)=>{last=e.results[0][0].transcript;};rec.onend=async()=>{pic.classList.remove('listening');dot.classList.remove('on');if(lock||!last||!isSession){last="";if(isSession&&!lock)setTimeout(loop,400);return;}let q=last;last="";lock=true;if(/^(bye|tchau|salani|fambai)$/i.test(q.trim())){isSession=false;statusEl.innerText='bye! tap again';lock=false;return;}statusEl.innerText='you: '+q;let a=await answer(q);speak(a);};rec.onerror=()=>{pic.classList.remove('listening');setTimeout(()=>{lock=false;if(isSession)loop();},700);};try{rec.start();}catch{lock=false;}}
pic.onclick=()=>{if(!keybox.classList.contains('hide'))return;if(isSession){isSession=false;speechSynthesis.cancel();try{rec.abort();}catch{}pic.classList.remove('listening','talking');dot.classList.remove('on');statusEl.innerText='stopped. tap to start';lock=false;return;}let k=localStorage.getItem('groq_key');if(!k){openKey();return;}isSession=true;lock=false;statusEl.innerText='starting...';setTimeout(loop,300);};
</script></body></html>
