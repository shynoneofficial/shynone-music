<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tati</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif}
html,body{height:100%;width:100%;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column}
#header{height:56px;background:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;border-bottom:1px solid #e9edef;flex-shrink:0}
#avatar{width:38px;height:38px;border-radius:50%;object-fit:cover}
#hinfo{flex:1}
#hname{font-weight:700;font-size:16px;color:#111b21}
#hsub{font-size:11px;color:#667781}
#gear{font-size:20px;cursor:pointer}
#modeSwitch{display:flex;background:#f0f2f5;padding:4px;margin:8px;border-radius:10px;gap:4px;flex-shrink:0}
.modeBtn{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:#667781}
.modeBtn.active{background:#fff;color:#111b21;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#chat{flex:1;overflow-y:auto;background:#efeae2;background-image:url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");background-size:400px;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
#voiceView{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;background:#111b21;padding:20px;gap:20px}
#voiceView.active{display:flex}
#bigPic{width:160px;height:160px;border-radius:50%;object-fit:cover;border:3px solid #00a884;transition:.3s}
#bigPic.talking{box-shadow:0 0 0 15px rgba(0,168,132,.3),0 0 60px #00a884;transform:scale(1.05)}
#bigPic.listening{box-shadow:0 0 0 15px rgba(241,92,109,.3),0 0 60px #f15c6d;transform:scale(1.05)}
#voiceStatus{color:#fff;font-size:14px;text-align:center;min-height:40px;max-width:85%}
#voiceBtnBig{width:72px;height:72px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:32px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#voiceBtnBig.listening{background:#f15c6d;animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.bubble{max-width:78%;padding:8px 10px 6px;border-radius:8px;font-size:14.5px;line-height:19px;position:relative;word-wrap:break-word;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.user{align-self:flex-end;background:#d9fdd3;border-top-right-radius:0}
.tati{align-self:flex-start;background:#fff;border-top-left-radius:0}
.time{font-size:10.5px;color:#667781;float:right;margin-left:8px;margin-top:4px}
.err{align-self:center;background:#ffecb3;color:#664d00;font-size:12px;padding:6px 10px;border-radius:12px}
#inputArea{flex-shrink:0;background:#f0f2f5;padding:6px 8px;display:flex;align-items:flex-end;gap:6px;padding-bottom:max(6px, env(safe-area-inset-bottom))}
#textBox{flex:1;background:#fff;border-radius:21px;padding:9px 12px;display:flex;min-height:42px}
#textInput{flex:1;border:none;outline:none;font-size:15px;background:transparent;resize:none;max-height:100px}
#sendBtn{width:45px;height:45px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
#keybox{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#keybox.hide{display:none}
.card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);width:100%;max-width:360px;text-align:center}
.kinput{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:10px;font-size:13px}
.kbtn{width:100%;margin-top:10px;padding:12px;border-radius:8px;border:none;background:#00a884;color:#fff;font-weight:700;cursor:pointer}
.kbtn.sec{background:#f0f2f5;color:#111}
</style></head><body>
<div id="header">
<img id="avatar" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'">
<div id="hinfo"><div id="hname">Tati</div><div id="hsub">from Mozambique 🇲🇿</div></div>
<div id="gear" onclick="openKey()">⚙️</div>
</div>

<div id="modeSwitch">
<button id="btnText" class="modeBtn active" onclick="setMode('text')">💬 Text</button>
<button id="btnVoice" class="modeBtn" onclick="setMode('voice')">🎤 Voice</button>
</div>

<div id="chat">
<div class="bubble tati">Hi! I'm Tati! From Mozambique, created by Esmeraldo Joaquim Manhique! Choose mode above 👆<span class="time">now</span></div>
</div>

<div id="voiceView">
<img id="bigPic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'">
<div id="voiceStatus">Tap mic to talk to Tati<br>Voice mode = Talks only, no text</div>
<button id="voiceBtnBig" onclick="tapVoice()">🎤</button>
</div>

<div id="inputArea">
<div id="textBox"><textarea id="textInput" rows="1" placeholder="Message" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"></textarea></div>
<button id="sendBtn" onclick="sendText()">➤</button>
</div>

<div id="keybox" class="hide"><div class="card">
<b>Tati Settings</b><br><span style="font-size:11px;color:#667781">Two modes: Text only / Voice only</span><br>
<input id="k" class="kinput" placeholder="Paste gsk_...">
<div id="kstatus" style="font-size:10px;color:#667781;margin-top:6px"></div>
<button class="kbtn" onclick="saveKey()">Save</button>
<button class="kbtn sec" onclick="testKey()">Test Key</button>
<div id="testRes" style="font-size:10px;margin-top:8px;text-align:left;max-height:80px;overflow:auto;word-break:break-all"></div>
<button class="kbtn sec" onclick="closeKey()">Close</button>
</div></div>

<script>
let chat=document.getElementById('chat'),voiceView=document.getElementById('voiceView'),textInput=document.getElementById('textInput'),inputArea=document.getElementById('inputArea'),btnText=document.getElementById('btnText'),btnVoice=document.getElementById('btnVoice'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus'),testRes=document.getElementById('testRes'),bigPic=document.getElementById('bigPic'),voiceStatus=document.getElementById('voiceStatus'),voiceBtnBig=document.getElementById('voiceBtnBig');
let rec=null,isListening=false,isSpeaking=false,chatHistory=[],mode='text';

function setMode(m){
  mode=m;
  if(m==='text'){
    btnText.classList.add('active'); btnVoice.classList.remove('active');
    chat.style.display='flex'; voiceView.classList.remove('active'); inputArea.style.display='flex';
    speechSynthesis.cancel(); isSpeaking=false; bigPic.classList.remove('talking','listening');
  }else{
    btnVoice.classList.add('active'); btnText.classList.remove('active');
    chat.style.display='none'; voiceView.classList.add('active'); inputArea.style.display='none';
    voiceStatus.innerHTML='Voice mode active<br>Tap mic - Tati will TALK, not text';
  }
}

function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||'';kstatus.innerText=localStorage.getItem('groq_key')?'Saved ✓':'No key';}
function closeKey(){keybox.classList.add('hide');}
let s=localStorage.getItem('groq_key'); if(!s||!s.startsWith('gsk_')) setTimeout(openKey,500);
function saveKey(){let v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Must be gsk_');return;} localStorage.setItem('groq_key',v); closeKey();}
async function testKey(){let key=kinput.value.trim()||localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){testRes.innerText='No key';return;} testRes.innerText='Testing...'; try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'user',content:'hi'}],max_tokens:10})}); let d=await r.json(); if(d.error) testRes.innerText='❌ '+d.error.message; else testRes.innerText='✅ Works!';}catch(e){testRes.innerText='❌ '+e.message;}}

function addBubble(text,type){
  let b=document.createElement('div'); b.className='bubble '+type;
  let t=new Date(); let tm=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
  b.innerHTML=text.replace(/\n/g,'<br>')+'<span class="time">'+tm+'</span>';
  chat.appendChild(b); chat.scrollTop=chat.scrollHeight;
}

function getVoice(){let v=speechSynthesis.getVoices();return v.find(x=>x.lang.startsWith('pt-PT'))||v.find(x=>x.lang.startsWith('pt'))||v.find(x=>x.name.includes('Female'))||v[0];}

function speak(text,onEnd){
  if(!text){ if(onEnd) onEnd(); return; }
  isSpeaking=true; bigPic.classList.add('talking'); voiceStatus.innerText='Tati speaking...';
  speechSynthesis.cancel();
  setTimeout(()=>{
    let vo=getVoice(); let u=new SpeechSynthesisUtterance(text); if(vo) u.voice=vo; u.rate=0.92;
    u.onend=()=>{isSpeaking=false; bigPic.classList.remove('talking'); voiceStatus.innerHTML='Tap mic to talk again<br>Voice = talks only'; if(onEnd) onEnd();};
    u.onerror=()=>{isSpeaking=false; bigPic.classList.remove('talking'); voiceStatus.innerText='Speech error - tap again'; if(onEnd) onEnd();};
    speechSynthesis.speak(u);
  },80);
}

async function askGroq(q){
  let key=localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){addBubble('⚙️ Add key - tap gear','err'); openKey(); return null;}
  chatHistory.push({role:'user',content:q}); if(chatHistory.length>12) chatHistory=chatHistory.slice(-12);
  try{
    let r=await fetch
