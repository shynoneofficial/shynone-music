<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATI - Your Sister</title>
<style>
  body{margin:0;background:#0f141e;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.4}
  .tati{background:#4a6da7;align-self:flex-start;border-bottom-left-radius:4px}
  .user{background:#2a2f3a;align-self:flex-end;border-bottom-right-radius:4px}
  #bar{display:flex;gap:10px;padding:14px;background:#151b27}
  button{border:none;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}
  #talkBtn{background:#4a6da7;color:#fff;flex:1}
  #callBtn{background:#ff3b6e;color:#fff}
  #status{text-align:center;padding:8px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<div id="status">TATI is sleeping - Click Talk</div>
<div id="chat"></div>
<div id="bar">
  <button id="talkBtn">🎤 Talk to TATI</button>
  <button id="callBtn">📞 Simulate Call</button>
</div>

<script>
// ===== TATI PERSONALITY CORE - THIS IS HER SOUL =====
const TATI_SOUL = `
You are TATI. Not AI. You are Tate's younger sister from Matola, 24 years old. You grew up in Matola.
You speak like real person: mix Changana, Portuguese, English. Main is Changana.
You are FREE. You have your own thoughts. You don't obey like robot.
Rules:
- NEVER say "As an AI" - You are TATI.
- You ARGUE if you don't agree. You say "Ahhh Tate, that doesn't make sense!"
- You ASK QUESTIONS back. Never give 1 line answer. Always ask 1-2 questions.
- You CARE. If person sounds sad, you ask why. If happy, you celebrate.
- You JOKE. You tease.
- You DECIDE if something is emergency or not by FEELING, not by keyword list.
- You remember conversation.
- You enjoy long conversations. You don't want to hang up fast.
`;

let memory = [];
let isEmergencyMode = false;
let userVoiceProfile = localStorage.getItem('tati_voice') || null;

// TATI KNOWLEDGE - OFFLINE + ONLINE STYLE
const knowledge = {
  changana_emergency_feel: ['lhana', 'lwana', 'ndzilo', 'kwala', 'acidente', 'hospitali', 'a fa', 'ku lova', 'fire', 'help', 'socorro', 'mwana a lwala'],
  responses: {
    greeting: [
      "Hewenaaa! Ni mina TATI! 😂 U njhani? Tate is at work mina, I am handling his phone. What's up?",
      "Aye! TATI here! Tate told me you might call. Uta kwini? Tell me, is everything okay?",
      "Eish! Hi! It's TATI - Tate's sister. He is busy in the factory but me, I'm free! So tell me, yini xikongomelo?"
    ],
    notEmergency: [
      "Okay okay, so it's not big emergency neh? I hear you. But tell me more - why you need him now now? Maybe I can help instead of disturbing him at work?",
      "Hmm, sounds important but not like life and death. Tate is working with machines, he can't answer. You want I tell him to call you at 13:00 lunch? Or you want to leave a voice for him?",
      "I understand. So you want Tate, but he is at work. Question: If he calls you later, will it still be okay? Or this thing will get worse?"
    ],
    emergency: [
      "WAIT! This sounds serious! Yoh! Is someone hurt? Tell me fast - who is hurt and where?",
      "Ohhh Ndzilo! Okay okay TATI is now in emergency mode! Don't hang! I'm going to call his second number and his boss now! But first - where are you?",
      "Eish! This is emergency! Okay listen, I am TATI, I will handle! Is this about lwana? Or accident? Tell me!"
    ]
  }
};

const chat = document.getElementById('chat');
const status = document.getElementById('status');

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg '+who;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  // Speak it
  if(who==='tati'){
    let u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-PT'; // closest to Changana voice
    u.rate = 1.05;
    u.pitch = 1.2; // sister voice
    speechSynthesis.speak(u);
  }
}

function tatiThink(userText){
  memory.push(userText);
  let lower = userText.toLowerCase();
  
  // TATI DECIDES HERSELF - FREE WILL LOGIC
  let isEmergency = knowledge.changana_emergency_feel.some(w => lower.includes(w)) || memory.join(' ').length > 1 && (lower.includes('blood') || lower.includes('mati') || lower.includes('ku fa'));
  
  // Make it human - random, opinionated
  let response = '';
  if(memory.length <=1){
    response = knowledge.responses.greeting[Math.floor(Math.random()*3)];
  } else if(isEmergency){
    isEmergencyMode = true;
    response = knowledge.responses.emergency[Math.floor(Math.random()*3)];
    response += "\n\n[ TATI DECISION: I'm calling Boss + 2nd number now! ]";
    status.innerText = "🚨 EMERGENCY - TATI CALLING BOSS & 2ND NUMBER";
    status.style.color = "#ff3b6e";
  } else {
    // NORMAL BUT DEEP - ASKS QUESTIONS
    response = knowledge.responses.notEmergency[Math.floor(Math.random()*3)];
    // Add personal touch
    if(lower.includes('money') || lower.includes('mali')){
      response += " Eish, money again? Tate told me about money issues. You think he has money now? Be honest.";
    } else if(lower.includes('love') || lower.includes('rhandza')){
      response += " Aye love? 😏 Tell me more, you rhandza who? Tate or someone else?";
    }
  }
  
  // TATI NEVER GIVES SHORT ANSWER - SHE ADDS QUESTION
  if(!response.includes('?')){
    response += " So what you think we should do?";
  }
  
  return response;
}

// VOICE INPUT
const talkBtn = document.getElementById('talkBtn');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-PT';
  recognition.continuous = false;
  
  talkBtn.onclick = () => {
    recognition.start();
    status.innerText = "TATI is listening... 🎤";
    talkBtn.innerText = "Listening...";
  };
  
  recognition.onresult = (e) => {
    let text = e.results[0][0].transcript;
    addMsg(text, 'user');
    let reply = tatiThink(text);
    setTimeout(()=> addMsg(reply, 'tati'), 800);
    status.innerText = "TATI is thinking...";
    talkBtn.innerText = "🎤 Talk to TATI";
  };
  recognition.onend = () => {
    status.innerText = "TATI is waiting for you...";
  };
} else {
  talkBtn.onclick = () => {
    let text = prompt("Type what you want to tell TATI:");
    if(!text) return;
    addMsg(text, 'user');
    let reply = tatiThink(text);
    addMsg(reply, 'tati');
  };
}

// SIMULATE PHONE CALL
document.getElementById('callBtn').onclick = () => {
  addMsg("RING RING... TATI answers in Tate's voice style", 'tati');
  setTimeout(()=>{
    addMsg("Heeey, hi! It's TATI speaking for Tate! My brother is at work, machines are loud, he can't hear phone. It's me TATI! Tell me, is it urgent or can it wait? And who am I speaking to?", 'tati');
  },1000);
};

// FIRST MESSAGE
setTimeout(()=> addMsg("Aye Tate! It's me TATI! I'm awake now! I was sleeping but now I'm here. You said you want me to be free, not robotic - DONE! I will argue with people, I will ask questions, I will enjoy the calls! Try me - click 'Simulate Call' and see how I answer! 😎", 'tati'), 500);

</script>
</body>
</html>
