<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tati</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center} #name{margin-top:20px;font-size:22px;font-weight:800;letter-spacing:4px} #wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative} #pic{width:210px;height:210px;border-radius:50%;object-fit:cover;border:3px solid #fff;cursor:pointer} #pic.listening{box-shadow:0 0 0 14px rgba(0,230,118,.3),0 0 60px #00e676} #pic.talking{box-shadow:0 0 0 14px rgba(74,109,167,.4),0 0 60px #4a6da7} #dot{position:absolute;bottom:20px;right:20px;width:14px;height:14px;border-radius:50%;background:#333} #dot.on{background:#00e676;box-shadow:0 0 12px #00e676} #status{margin-bottom:18px;font-size:11px;opacity:.6} #keybox{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99} #keybox.hide{display:none} .card{background:#121a2a;padding:20px;border-radius:18px;width:100%;max-width:360px;text-align:center} input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:12px} button{width:100%;margin-top:12px;padding:12px;border-radius:20px;border:none;background:#00e676;font-weight:900;color:#000}</style></head><body>
<div id="name">Tati</div>
<div id="wrap"><img id="pic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"><div id="dot"></div></div>
<div id="status">tap to talk</div>

<div id="keybox"><div class="card">
<b style="font-size:18px">Tati needs her brain 🧠</b><br><br>
<span style="font-size:12px;opacity:.7">You copied key from groq.com - now paste it here:</span>
<input id="k" placeholder="gsk_... paste here">
<button onclick="save()">Save Brain & Start Tati</button>
<div style="font-size:10px;opacity:.4;margin-top:10px">Your key stays only in your phone. Free.</div>
</div></div>

<script>
let pic=document.getElementById('pic'),dot=document.getElementById('dot'),statusEl=document.getElementById('status'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k');
let isSession=false,isSpeaking=false,isProcessing=false,rec,last="",lock=false;
let saved=localStorage.getItem('groq_key');
if(saved && saved.startsWith('gsk_')){ keybox.classList.add('hide'); } else { kinput.value=saved||''; }
function save(){let v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Key must start with gsk_ - you copied wrong. Copy again from groq.com');return;} localStorage.setItem('groq_key',v); keybox.classList.add('hide'); speak("Hi! I'm Tati, your sister. My brain is online now!");}
function getVoice(){let v=speechSynthesis.getVoices();return v.find(x=>x.name.includes('Female'))||v.find(x=>x.name.includes('Samantha'))||v.find(x=>x.name.includes('Zira'))||v.find(x=>x.lang==='en-US')||v[0];}
function speak(t){if(!t||isSpeaking)return;isSpeaking=true;lock=true;pic.classList.add('talking');pic.classList.remove('listening');dot.classList.remove('on');statusEl.innerText='Tati speaking...';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);let vo=getVoice();if(vo)u.voice=vo;u.lang='en-US';u.rate=0.92;u.pitch=1.15;u.onend=()=>{isSpeaking=false;pic.classList.remove('talking');setTimeout(()=>{lock=false;if(isSession)loop();},600);};speechSynthesis.speak(u);}
async function answer(q){let key=localStorage.getItem('groq_key')||''; try{isProcessing=true;statusEl.innerText='thinking...';let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'system',content:'You are Tati, friendly young woman from Matola, sister. Speak English only, natural, warm, 1-2 sentences.'},{role:'user',content:q}],max_tokens:120})});let d=await r.json();return d.choices[0].message.content.trim();}catch{return "Sorry, my brain is offline. Check my key.";}finally{isProcessing=false;}}
function loop(){if(!isSession||isSpeaking||isProcessing||lock)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(rec)try{rec.abort();}catch{} rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang='en-US';rec.onstart=()=>{pic.classList.add('listening');dot.classList.add('on');statusEl.innerText='listening...';};rec.onresult=(e)=>{last=e.results[0][0].transcript;};rec.onend=async()=>{pic.classList.remove('listening');dot.classList.remove('on');if(lock||!last||!isSession){last="";if(isSession&&!lock)setTimeout(loop,400);return;}let q=last;last="";lock=true;if(/^(bye|tchau|salani|fambai)$/i.test(q.trim())){isSession=false;statusEl.innerText='bye! tap again';lock=false;return;}statusEl.innerText='you: '+q;let a=await answer(q);speak(a);};rec.onerror=()=>{pic.classList.remove('listening');setTimeout(()=>{lock=false;if(isSession)loop();},700);};try{rec.start();}catch{lock=false;}}
pic.onclick=()=>{if(keybox && !keybox.classList.contains('hide'))return;if(isSession){isSession=false;speechSynthesis.cancel();try{rec.abort();}catch{}pic.classList.remove('listening','talking');dot.classList.remove('on');statusEl.innerText='stopped. tap to start';lock=false;return;}isSession=true;lock=false;statusEl.innerText='starting...';setTimeout(loop,300);};
</script></body></html>
