  if(/\b(bye|see you later|goodbye|stop talking|para|tchau|adeus|ndza famba|salani)\b/i.test(heard)){var byeMsg=lang==='pt'?'Tchau! Foi bom falar contigo. Toca na Tati quando quiseres falar de novo.':lang==='ch'?'Salani! Ku va kahle ku vulavula na wena. Tsindza Tati loko u lava ku vulavula nakambe.':'Bye! Good talking with you. Tap Tati when you want to talk again.';addBubble(heard,'user'); addBubble(byeMsg,'tati');voiceStatus.innerHTML=byeMsg;speak(byeMsg,function(){ stopVoiceConversation(); });return;}
  if(/\b(switch off|turn off|stop listening|shut up|be quiet|enough|desliga|para de ouvir|chega|cala|yima|miyela|pfala)\b/i.test(heard)){var offMsg=lang==='pt'?'OK, parei.':lang==='ch'?'OK, ndzi yimile.':'Okay, I stopped.';addBubble(heard,'user'); addBubble(offMsg,'tati');speak(offMsg,function(){ stopVoiceConversation(); });return;}
  if(rec) try{rec.abort()}catch(e){}
  isListening=false;
  voiceStatus.innerHTML=LANGS[lang].thinking+' "'+heard+'"';
  var ans=await askGroq(heard,false);
  if(!voiceOn) return;
  if(ans){addBubble(heard,'user'); addBubble(ans,'tati');voiceStatus.innerHTML=ans;speak(ans,function(){if(voiceOn){voiceStatus.innerHTML=LANGS[lang].listening+'<br>Your turn...';bigPic.classList.add('listening');setTimeout(function(){ if(voiceOn) startVoiceLoop(); },400);}});} else {if(voiceOn) startVoiceLoop();}
}
function speak(text,cb){
  if(!text){if(cb)cb();return}
  // CRITICAL: STOP listening while speaking, so she does not hear herself
  if(rec) try{rec.abort()}catch(e){}
  isSpeaking=true;bigPic.classList.add('talking');bigPic.classList.remove('listening');
  try{speechSynthesis.cancel()}catch(e){}
  setTimeout(function(){
    if(!isSpeaking && !text) {if(cb)cb();return;}
    var vo=getVoice();var u=new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,''));if(vo)u.voice=vo;u.lang=(lang==='pt'||lang==='ch')?'pt-PT':'en-US';u.rate=0.95;u.volume=1;
    u.onend=function(){isSpeaking=false;bigPic.classList.remove('talking');if(cb)cb()};
    u.onerror=function(){isSpeaking=false;bigPic.classList.remove('talking');if(cb)cb()};
    speechSynthesis.speak(u);
    // Safety: if TTS hangs, force stop after 15 sec
    setTimeout(function(){ if(isSpeaking){ try{speechSynthesis.cancel()}catch(e){} isSpeaking=false; bigPic.classList.remove('talking'); if(cb)cb(); } },15000);
  },120);
}
function cleanAnswer(s){s=s.replace(/\b\d+\s*letters?\b/gi,'').replace(/contains.*comma|contains.*dot/gi,'').trim();return s}
async function summarizeIfNeeded(){var full=getFullHistory();if(full.length<20||full.length%20!==0)return;var key=EMBEDDED_KEY||localStorage.getItem('groq_key')||'';if(!key.startsWith('gsk_'))return;try{var toSum=full.slice(-30,-10);var prompt="Summarize into 100 words key facts:\n"+toSum.map(m=>m.role+": "+m.content).join("\n");var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'You are memory summarizer.'},{role:'user',content:prompt}],max_tokens:150})});var d=await r.json();var summary=d.choices?.[0]?.message?.content||getMemory();saveMemory(summary)}catch(e){}}
async function askGroq(q,isListen){var detected=detectLang(q); if(detected!==lang){applyLang(detected,true);}if(isBusy){var waitMsg=lang==='pt'?'Espera, estou a pensar...':lang==='ch'?'Yima, ndzi ehleketa...':'Wait, I am thinking...';addBubble('⏳ '+waitMsg,'err');return null}isBusy=true;updateMoodByText(q);var key=EMBEDDED_KEY||localStorage.getItem('groq_key')||'';var full=getFullHistory();var controller=new AbortController();var timeout=setTimeout(()=>{try{controller.abort()}catch(e){}},12000);try{var memorySummary=getMemory();var authentic=getAuth();var names=JSON.stringify(getNames());var moodPrompt=getMoodPrompt();var user=getUser();var found=checkNameInText(q);if(found)user=getUser();var userInfo="CURRENT USER: Name="+(user.name||"UNKNOWN")+ " Role="+user.role+". If UNKNOWN ask name once. If owner-father, call him Father/Boss/Pai.";var recent=full.slice(-6).map(m=>({role:m.role,content:m.content}));var systemContent=LANGS[lang].sys+"\n\n"+CURRENT_FACTS+"\n\n"+userInfo+"\n\n"+moodPrompt+"\n\nLONG TERM MEMORY:\n"+memorySummary+"\n\nAUTHENTIC TRUTH (PRIORITY 1):\n"+(authentic||"none yet")+"\n\nKNOWN NAMES:\n"+names+"\n\nRULES: NEVER BE SILENT. If you don't know, say you don't have that info yet and you will research / wait for update from creator, then offer help. Respond in user's language ("+lang+"). For Changana, use Xitsonga fallback.";if(isListen)systemContent+="\n\nTHIS IS LISTEN MODE - People talking around, not directly to you. Join like real person. Do NOT repeat what you heard word for word.";var messages=[{role:'system',content:systemContent},...recent,{role:'user',content:q}];if(!key.startsWith('gsk_')){var ans=lang==='pt'?"Ainda não tenho essa info completa, mas lembro: '"+q+"'. Vou pesquisar. O que mais posso ajudar?":lang==='ch'?"A ndzi na vuxokoxoko lebyi, kambe ndza tsundzuka: '"+q+"'. Ndzi ta lavisisa.":"I don't have that full info yet, but I remember: '"+q+"'. I will research it. What else?";full.push({role:'user',content:q,ts:Date.now()},{role:'assistant',content:ans,ts:Date.now()});saveFullHistory(full);clearTimeout(timeout);isBusy=false;return ans}var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:MODEL,messages:messages,max_tokens:350,temperature:0.85}),signal:controller.signal});var d=await r.json();if(d.error){var eMsg=lang==='pt'?'Desculpa, tive erro, mas estou aqui. Ainda não tenho essa info, vou pesquisar. Fala de novo.':lang==='ch'?'Ndza rivalela, ku na xihoxo, kambe ndzi kona. A ndzi na info leyi, ndzi ta lavisisa.':'Sorry, I had an error, but I am here. I don\'t have that info yet, I will research it. Talk again.';addBubble(eMsg,'tati');clearTimeout(timeout);isBusy=false;return eMsg}var ans=cleanAnswer(d.choices[0].message.content.trim());if(!ans||ans.length<3){ans=lang==='pt'?'Ainda não tenho essa info, vou pesquisar e esperar atualização do meu criador. Posso ajudar com música ou outra coisa?':lang==='ch'?'A ndzi na vuxokoxoko lebyi, ndzi ta lavisisa. Ndzi nga ku pfuna hi vunanga?':'I don\'t have that info yet, I will research it. I can help with music or anything else?'}full.push({role:'user',content:q,ts:Date.now()},{role:'assistant',content:ans,ts:Date.now()});saveFullHistory(full);clearTimeout(timeout);isBusy=false;summarizeIfNeeded();return ans;}catch(e){clearTimeout(timeout);isBusy=false;var fMsg=lang==='pt'?'Ainda não tenho essa info completa, vou pesquisar. Fala de novo, estou aqui.':lang==='ch'?'A ndzi na vuxokoxoko lebyi, ndzi ta lavisisa. Vulavula nakambe, ndzi kona.':'I don\'t have that info yet, I will research it. Talk again, I am here.';addBubble(fMsg,'tati');return fMsg}}
async function sendText(){var q=textInput.value.trim();if(!q)return;addBubble(q,'user');textInput.value='';textInput.style.height='auto';var ans=await askGroq(q,false);if(ans)addBubble(ans,'tati')}
var busOn=false,lastBusTime=0,busRec=null;
function toggleBus(){if(busOn){busOn=false;busBtn.textContent='👂 Listen: OFF';busBtn.classList.remove('on');if(busRec)try{busRec.abort()}catch(e){}if(farStream){try{farStream.getTracks().forEach(function(t){t.stop()})}catch(e){} farStream=null;}try{speechSynthesis.cancel()}catch(e){}isSpeaking=false;return}busOn=true;busBtn.textContent='👂 Listen: ON';busBtn.classList.add('on');startBusListening()}
function startBusListening(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;busRec=new SR();busRec.continuous=true;busRec.interimResults=true;busRec.lang=(lang==='en')?'en-US':'pt-PT';var finalTxt='';busRec.onresult=function(e){
 var allTextSoFar='';for(var j=0;j<e.results.length;j++){allTextSoFar+=e.results[j][0].transcript+' ';}
 var low=allTextSoFar.toLowerCase();
 if(/switch off|turn off|stop listening|stop listen|shut up|be quiet|enough|quiet please|desliga|para de ouvir|para|chega|cala|calma|yima|swi yima|miyela|pfala|tati para|tati stop|tati yima/.test(low)){
   busOn=false;busBtn.textContent='👂 Listen: OFF';busBtn.classList.remove('on');
   try{busRec.abort()}catch(e2){}
   killAllAudio();
   addBubble('👂 OK, Listen OFF. I stopped. Tap Listen ON when you want me back.','tati');
   return;
 }
 if(isSpeaking) return;
 var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)finalTxt+=t+' '; else interim+=t}var all=(finalTxt+interim).toLowerCase();if(!all)return;var now=Date.now();if(now-lastBusTime<90000)return;var funny=/haha|kkk|lol|😂|muito engraçado|funny/i.test(all);var price=/\b\d{3,5}\s*(mt|mts|meticais)\b/i.test(all);var sad=/triste|chorar|zangado|angry|sad|estou mal/i.test(all);var trigger=null;if(funny)trigger='FUNNY';else if(price && all.match(/\d+/)){var num=parseInt(all.match(/\d+/)[0]);if(num>4000)trigger='PRICE_LIE'}else if(sad)trigger='EMPATHY';else if(Object.keys(getNames()).length<3 && all.length>20 && Math.random()>0.7)trigger='ASK_NAME';if(trigger){lastBusTime=now;handleBusJump(trigger,finalTxt+interim);finalTxt=''}};busRec.onend=function(){if(busOn && !isSpeaking)setTimeout(startBusListening,800)};busRec.onerror=function(){if(busOn && !isSpeaking)setTimeout(startBusListening,1500)};try{busRec.start()}catch(e){}}
async function handleBusJump(trigger,heardText){if(busRec) try{busRec.abort()}catch(e){}var q='';if(trigger==='FUNNY')q=`Group talk: "${heardText}" - Very funny! Join laughing.`;else if(trigger==='PRICE_LIE')q=`Group talk: "${heardText}" - Price lie vs authentic truth. Correct politely.`;else if(trigger==='EMPATHY')q=`Group talk: "${heardText}" - Someone sad. Join with empathy.`;else if(trigger==='ASK_NAME')q=`Group talk: "${heardText}" - New voice, ask name like real person.`;var ans=await askGroq(q,true);if(ans){addBubble(ans,'tati');speak(ans,function(){ if(busOn) setTimeout(startBusListening,500); });if(trigger==='ASK_NAME'){var maybe=heardText.match(/(?:sou|chamo|meu nome é)\s+(\w+)/i);if(maybe)saveName(Date.now(),maybe[1])}} else { if(busOn) setTimeout(startBusListening,500); }}
