<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tati - SHYNONE MUSIC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#efeae3}
.header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.header b{letter-spacing:2px;font-size:18px}
.header small{display:block;text-align:center;color:#0a7a5a;font-size:8px;letter-spacing:3px}
.langs button{border:none;background:#eee;padding:6px 8px;border-radius:20px;font-weight:bold;cursor:pointer}
.langs button.active{background:#0a1a2e;color:#fff}
.tabs{display:flex;background:#f0f0f0;padding:8px;gap:8px}
.tabs button{flex:1;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;background:#e8e8e8}
.tabs button.active{background:#0a1a2e;color:#fff}
#chat{padding:12px;padding-bottom:90px;min-height:60vh}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;margin:8px 0;font-size:15px;line-height:1.5;position:relative;padding-bottom:18px}
.msg.me{background:#d9fdd3;margin-left:auto;border-bottom-right-radius:2px}
.msg.tati{background:#fff;margin-right:auto;border-bottom-left-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.time{position:absolute;right:8px;bottom:4px;font-size:10px;color:#667781;display:flex;gap:3px;align-items:center}
.ticks{font-size:12px;color:#8696a0}
.ticks.read{color:#ff0000;font-weight:bold}
.inputbar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px;display:flex;gap:8px;align-items:center;border-top:1px solid #ddd}
.inputbar input{flex:1;border:none;background:#f0f0f0;padding:13px 15px;border-radius:25px;outline:none;font-size:15px}
.send{width:48px;height:48px;border:none;border-radius:50%;background:#ff0000;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.listenBtn{display:block;margin:8px auto;background:#fff;border:1px solid #0a7a5a;color:#0a7a5a;padding:6px 12px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <img src="tati.jpg" style="width:38px;height:38px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'">
  <div><b>SHYNONE</b><small>MUSIC</small></div>
  <div class="langs"><button class="active">EN</button><button>PT</button><button>CH</button></div>
</div>

<div class="tabs">
  <button class="active">💬 Text</button>
  <button onclick="alert('Voice coming soon')">🎤 Voice</button>
  <button onclick="alert('Listen coming soon')">👂 Listen</button>
</div>

<button class="listenBtn" onclick="toggleListen(this)">👂 Listen: OFF</button>

<div id="chat">
  <div class="msg tati">Hi! I am Tati from SHYNONE MUSIC, Mozambique MZ.<br><br>I was created by the Founder, Mister Manhique, Founder of SHYNONE MUSIC, to promote Mozambican music.<br><br>You can ask me anything, I can assist you with whatever you need.<span class="time">15:53</span></div>
</div>

<div class="inputbar">
  <input id="inp" placeholder="Message Tati...">
  <button class="send" onclick="sendMsg()">➤</button>
</div>

<script>
// --- PUT YOUR GROQ KEY HERE, SAME AS BEFORE ---
const GROQ_KEY = "PASTE_YOUR_OLD_GROQ_KEY_HERE";

function timeNow(){let d=new Date();return d.getHours()+":"+String(d.getMinutes()).padStart(2,'0')}
function addMsg(text,who){
  let c=document.getElementById('chat');
  let d=document.createElement('div');
  d.className='msg '+(who=='me'?'me':'tati');
  if(who=='me'){
    d.innerHTML=text+'<span class="time">'+timeNow()+' <span class="ticks" id="tk'+Date.now()+'">✓</span></span>';
  } else {
    d.innerHTML=text+'<span class="time">'+timeNow()+'</span>';
  }
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
  window.scrollTo(0,document.body.scrollHeight);
  return d;
}
async function sendMsg(){
  let inp=document.getElementById('inp');
  let txt=inp.value.trim(); if(!txt) return;
  let myMsg=addMsg(txt,'me');
  inp.value='';
  // Tick 1: Sent -> after 300ms Tick 2: Delivered
  let tickEl=myMsg.querySelector('.ticks');
  setTimeout(()=>{if(tickEl)tickEl.textContent='✓✓'},300);
  // Tati typing
  let typing=addMsg('Tati is typing...','tati');
  try{
    // 1. Try your Information Centre first
    let infoRes=await fetch('information.json').then(r=>r.json()).catch(()=>[]);
    let found=null;
    if(Array.isArray(infoRes)){ found=infoRes.find(x=> txt.toLowerCase().includes(x.topic.toLowerCase()) || x.topic.toLowerCase().includes(txt.toLowerCase())); }
    let answer="";
    if(found){ answer=found.facts; }
    else{
      // 2. Groq fallback
      let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'system',content:'You are Tati from SHYNONE MUSIC Mozambique. Created by Founder Mister Manhique to promote Mozambican music. Answer short, friendly.'},{role:'user',content:txt}]})});
      let j=await r.json();
      answer=j.choices[0].message.content;
    }
    typing.remove();
    addMsg(answer,'tati');
    // Tick 3: RED = Seen/Read
    if(tickEl){tickEl.textContent='✓✓';tickEl.classList.add('read')}
  }catch(e){ typing.remove(); addMsg('Sorry Boss, connection problem. Try again.','tati'); }
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
function toggleListen(btn){ if(btn.textContent.includes('OFF')){btn.textContent='👂 Listen: ON'}else{btn.textContent='👂 Listen: OFF'} }
</script>
</body>
</html>
