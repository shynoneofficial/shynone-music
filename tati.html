<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tati - SHYNONE MUSIC</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}body{display:flex;flex-direction:column;height:100vh;background:#fff;overflow:hidden}#header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}#greenLine{height:4mm;background:#00a884}#modeSwitch{display:flex;background:#f0f2f5;padding:4px;margin:8px;border-radius:10px;gap:4px}.modeBtn{flex:1;padding:9px;border-radius:8px;border:none;font-weight:800;font-size:11px;cursor:pointer;background:transparent}.modeBtn.active{background:#0a192f;color:#fff}#chat{flex:1;overflow-y:auto;padding:12px;background:#f6f3ee;display:flex;flex-direction:column;gap:4px}.bubble{max-width:75%;padding:7px 10px;font-size:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}.user{align-self:flex-end;background:#d9fdd3}.tati{align-self:flex-start;background:#fff}#inputArea{background:#f0f2f5;padding:7px;display:flex;gap:6px}#textBox{flex:1;background:#fff;border-radius:22px;padding:8px 12px;display:flex}#textInput{flex:1;border:none;outline:none;font-size:14px}#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:#0a192f;color:#fff;font-size:16px}#peopleView{flex:1;display:none;flex-direction:row;background:#fff;overflow:hidden}#peopleView.show{display:flex}#peopleList{width:100%;max-width:380px;border-right:1px solid #eee;display:flex;flex-direction:column;overflow:hidden}#peopleChat{flex:1;display:none;flex-direction:column;background:#f6f3ee;overflow:hidden}#peopleChat.open{display:flex}.pContact{display:flex;gap:10px;padding:12px 10px;cursor:pointer;border-bottom:1px solid #f0f2f5;align-items:center}.pAvatar{width:42px;height:42px;border-radius:50%;background:#0a192f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}.pAvatar img{width:100%;height:100%;object-fit:cover}#pMsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}.safeModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:14px}.safeModal.show{display:flex}.safeCard{background:#fff;width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:16px;padding:18px}.safeInput{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-top:5px;font-size:14px}.countrySel{padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:700}.kbtn{width:100%;margin-top:10px;padding:11px;border-radius:8px;border:none;background:#0a192f;color:#fff;font-weight:700;cursor:pointer}.kbtn.sec{background:#f0f2f5;color:#111}.kbtn.green{background:#00a884}.kbtn.red{background:#e03131}.camBtn{padding:7px 10px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:11px;font-weight:800;cursor:pointer}.thumb{width:64px;height:64px;border-radius:50%;border:2px solid #00a884;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.coverThumb{width:100%;height:70px;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;overflow:hidden}.coverThumb img{width:100%;height:100%;object-fit:cover}.coverBox{height:90px;background:#0a192f;background-size:cover;background-position:center;position:relative}.profCircle{width:64px;height:64px;border-radius:50%;border:3px solid #fff;object-fit:cover;background:#fff;position:absolute;bottom:-18px;left:14px}.reqCard{background:#fff7e6;border:1px solid #f5c542;border-radius:12px;padding:12px;margin:10px}@media(max-width:900px){#peopleView.chatOpen #peopleList{display:none}#peopleView.chatOpen #peopleChat{display:flex}}@media(min-width:900px){#peopleChat{display:flex}}</style></head><body>
<div id="header"><b>Tati</b><div style="text-align:center;line-height:1"><b>SHYNONE</b><br><span style="font-size:7px;letter-spacing:3px;color:#00a884">MUSIC</span></div><b>🇲🇿</b></div>
<div id="greenLine"></div>
<div id="modeSwitch"><button id="btnText" class="modeBtn active">💬 Tati</button><button id="btnPeople" class="modeBtn">👥 People</button></div>
<div id="chat"></div>
<div id="peopleView"><div id="peopleList">
<div id="registerBox" style="padding:12px;background:#eafff5;border-bottom:1px solid #00a884"><div style="font-weight:900">👋 Register - Free, No Code</div><div style="font-size:11px;color:#667781">Your face is your verification. No SMS.</div>
<input id="myNameInput" class="safeInput" placeholder="Your Name - Esmeraldo Manhique">
<div style="display:flex;gap:6px;margin-top:6px"><select id="myCountry" class="countrySel"></select><input id="myPhoneInput" class="safeInput" style="margin:0;flex:1" placeholder="848595993" inputmode="tel"></div>
<div style="margin-top:12px"><b style="font-size:12px">👤 Profile Picture</b><div style="display:flex;gap:10px;align-items:center;margin-top:6px"><div id="profilePreview" class="thumb">👤</div><div><button class="camBtn" id="profileUploadBtn">📁 Upload</button> <button class="camBtn" id="profileSelfieBtn">📸 Selfie</button></div></div><input type="file" id="profileFile" accept="image/*" style="display:none"></div>
<div style="margin-top:12px"><b style="font-size:12px">🖼️ Cover - Like Facebook</b><div id="coverPreview" class="coverThumb">🖼️ Cover</div><div style="display:flex;gap:6px;margin-top:6px"><button class="camBtn" id="coverUploadBtn" style="flex:1">📁 Upload Cover</button><button class="camBtn" id="coverSelfieBtn" style="flex:1">📸 Selfie Cover</button></div><input type="file" id="coverFile" accept="image/*" style="display:none"></div>
<button class="kbtn" id="myRegisterBtn">✅ Register Me - Free</button><div id="myRegisterStatus" style="font-size:11px;margin-top:6px"></div></div>
<div id="myProfileBox" style="display:none;flex-direction:column;border-bottom:1px solid #eee"><div id="myCoverBg" class="coverBox"><img id="myProfileImg" class="profCircle" style="display:none"><div id="myProfileLetter2" class="profCircle" style="display:flex;align-items:center;justify-content:center;font-weight:900">E</div></div><div style="padding:28px 12px 10px"><div style="font-weight:900"><span id="myProfileName"></span> <span style="font-size:10px;color:#00a884">● On Tati</span> <span id="mySelfieBadge" style="font-size:10px"></span></div><div style="font-size:11px;color:#667781" id="myProfilePhone"></div><div style="font-size:11px;color:#00a884">🟢 Online</div></div></div>
<div id="requestsBox" style="display:none"></div>
<div style="padding:10px;border-bottom:1px solid #eee"><button class="kbtn" id="pAddToggleBtn" style="margin:0">+ Add Contact</button><div id="pAddForm" style="display:none;margin-top:8px"><div style="display:flex;gap:6px"><select id="pCountry" class="countrySel"></select><input id="pNewPhone" class="safeInput" style="margin:0;flex:1" placeholder="991234567" inputmode="tel"></div><button class="kbtn" id="pAddBtn">Send Chat Request</button><button class="kbtn sec" id="pAddCancelBtn">Cancel</button></div><div id="pPhoneErr" style="font-size:11px;padding:6px 0"></div></div>
<div id="pList" style="overflow-y:auto;flex:1"></div></div>
<div id="peopleChat"><div style="background:#fff;padding:10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee"><div style="width:38px;height:38px;border-radius:50%;background:#0a192f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden"><span id="chatAvatarLetter">?</span><img id="chatAvatarImg" style="display:none;width:100%;height:100%;object-fit:cover"></div><div style="flex:1"><div id="pChatTitle" style="font-weight:900">Tap a person to chat</div><div style="font-size:11px;color:#667781">Tap 👥 People to go back</div></div></div><div id="pMsgs"></div><div style="background:#f0f2f5;padding:7px;display:flex;gap:6px"><div style="flex:1;background:#fff;border-radius:22px;padding:8px 12px;display:flex"><input id="pInput" style="flex:1;border:none;outline:none" placeholder="Message..."></div><button id="pSendBtn" style="width:42px;height:42px;border-radius:50%;border:none;background:#0a192f;color:#fff">➤</button></div></div></div>
<div id="selfieModal" class="safeModal"><div class="safeCard" style="text-align:center"><div style="font-weight:900">📸 Take Selfie</div><video id="selfieVideo" autoplay playsinline style="width:100%;max-height:300px;border-radius:12px;background:#000;margin-top:10px"></video><canvas id="selfieCanvas" style="display:none"></canvas><img id="selfiePreviewImg" style="display:none;width:100%;max-height:300px;border-radius:12px;margin-top:10px"><button class="kbtn" id="captureSelfieBtn">📸 Capture</button><button class="kbtn green" id="useSelfieBtn" style="display:none">✅ Use This Selfie</button><button class="kbtn sec" id="retakeSelfieBtn" style="display:none">🔄 Retake</button><button class="kbtn sec" id="closeSelfieBtn">Close</button></div></div>
<div id="inputArea"><div id="textBox"><input id="textInput" placeholder="Message Tati..."></div><button id="sendBtn">➤</button></div>
<script>
var TATI_API="https://tati-server.dilemahluza.workers.dev";
var COUNTRIES=[["Mozambique","258"],["South Africa","27"],["Malawi","265"],["Angola","244"],["India","91"],["Portugal","351"],["Brazil","55"],["USA","1"],["United Kingdom","44"]];
function fillSel(s){s.innerHTML="";COUNTRIES.forEach(c=>{var o=document.createElement("option");o.value=c[1];o.textContent=c[0]+" (+"+c[1]+")";s.appendChild(o)});s.value="258"}
function buildPhone(cc,raw){var s=(raw||"").trim();if(!s)return"";if(s[0]==="+")return "+"+s.slice(1).replace(/\D/g,"");var d=s.replace(/\D/g,"");if(d.indexOf(cc)===0)return "+"+d;return "+"+cc+d}
function el(id){return document.getElementById(id)}
function getMe(){try{return JSON.parse(localStorage.getItem("tati_my_registered")||"null")}catch(e){return null}}
function saveMe(o){localStorage.setItem("tati_my_registered",JSON.stringify(o))}
function sg(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function compress(src,maxW,cb){var img=new Image();img.onload=function(){var cv=document.createElement("canvas");var sc=Math.min(1,maxW/img.width);cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",0.7))};if(typeof src==="string")img.src=src;else{var r=new FileReader();r.onload=()=>img.src=r.result;r.readAsDataURL(src)}}
async function call(b){try{var r=await fetch(TATI_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return await r.json()}catch(e){return{ok:false,msg:"Server offline"}}}
var tempProfile="",tempCover="",selfieTarget="profile",selfieStream=null,selfieData="";
async function openSelfie(t){selfieTarget=t;el("selfieVideo").style.display="block";el("selfiePreviewImg").style.display="none";el("useSelfieBtn").style.display="none";el("retakeSelfieBtn").style.display="none";el("captureSelfieBtn").style.display="block";el("selfieModal").classList.add("show");try{selfieStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});el("selfieVideo").srcObject=selfieStream}catch(e){}}
function closeSelfie(){if(selfieStream)selfieStream.getTracks().forEach(t=>t.stop());el("selfieModal").classList.remove("show")}
function refreshUI(){var me=getMe();if(me){el("registerBox").style.display="none";el("myProfileBox").style.display="flex";el("myProfileName").textContent=me.name;el("myProfilePhone").textContent=me.phone;el("mySelfieBadge").textContent=(me.profilePic||me.coverPic)?"📸 Selfie Verified":"⚠️ No selfie";if(me.coverPic)el("myCoverBg").style.backgroundImage="url("+me.coverPic+")";if(me.profilePic){el("myProfileImg").src=me.profilePic;el("myProfileImg").style.display="block";el("myProfileLetter2").style.display="none"}tempProfile=me.profilePic||"";tempCover=me.coverPic||""}else{el("registerBox").style.display="block";el("myProfileBox").style.display="none"}}
var currentId=null,lastPoll=0,pollTimer=null;
function getContacts(){return sg("tati_people_contacts",[])} function saveContacts(c){ss("tati_people_contacts",c)}
function getMsgs(id){return sg("tati_people_msgs_"+id,[])} function saveMsgs(id,m){ss("tati_people_msgs_"+id,m)}
function renderList(){var list=el("pList");var cs=getContacts();if(!cs.length){list.innerHTML="<div style='padding:20px;text-align:center;color:#667781'>No people yet. Tap + Add Contact.</div>";return}list.innerHTML="";cs.forEach(c=>{var msgs=getMsgs(c.id);var last=msgs.length?msgs[msgs.length-1].text:"No messages yet";var st=c.status==="pending"?"⏳ Waiting...":c.status==="declined"?"❌ Declined":"✅ Chat open";var av=c.profilePic?"<div class='pAvatar'><img src='"+c.profilePic+"'></div>":"<div class='pAvatar'>"+(c.name[0]||"?")+"</div>";var div=document.createElement("div");div.className="pContact";div.innerHTML=av+"<div style='flex:1'><div style='font-weight:800'>"+c.name+" "+(c.hasSelfie?"📸":"⚠️")+"</div><div style='font-size:11px;color:#667781'>"+st+"</div><div style='font-size:12px;color:#667781'>"+last+"</div></div><div style='font-size:11px'>"+c.phone+"</div>";div.onclick=()=>{if(c.status!=="accepted")return alert(st);openChat(c.id)};list.appendChild(div)})}
function openChat(id){currentId=id;var c=getContacts().find(x=>x.id===id);el("pChatTitle").textContent=c.name+" - "+c.phone;if(c.profilePic){el("chatAvatarImg").src=c.profilePic;el("chatAvatarImg").style.display="block";el("chatAvatarLetter").style.display="none"}el("peopleView").classList.add("chatOpen");el("peopleChat").classList.add("open");renderMsgs();startPolling()}
function renderMsgs(){var box=el("pMsgs");if(!currentId)return;var msgs=getMsgs(currentId);box.innerHTML="";msgs.forEach(m=>{var d=document.createElement("div");d.className="bubble "+(m.from==="me"?"user":"tati");d.textContent=m.text;box.appendChild(d)});box.scrollTop=box.scrollHeight}
async function sendMsg(){if(!getMe()||!currentId)return;var inp=el("pInput");var txt=inp.value.trim();if(!txt)return;var me=getMe();var c=getContacts().find(x=>x.id===currentId);var msgs=getMsgs(currentId);msgs.push({from:"me",text:txt,at:Date.now()});saveMsgs(currentId,msgs);inp.value="";renderMsgs();renderList();await call({action:"send_message",from:me.phone,to:c.phone,text:txt,type:"text"})}
function renderRequests(list){var box=el("requestsBox");if(!list||!list.length){box.style.display="none";box.innerHTML="";return}box.style.display="block";box.innerHTML="<div style='font-weight:900;padding:10px 10px 0'>🔔 Chat Requests - Check the face</div>";list.forEach(r=>{var div=document.createElement("div");div.className="reqCard";var prof=r.fromProfilePic?"<img src='"+r.fromProfilePic+"' style='width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #00a884'>":"<div style='width:56px;height:56px;border-radius:50%;background:#0a192f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900'>"+r.fromName[0]+"</div>";var cover=r.fromCoverPic?"<img src='"+r.fromCoverPic+"' style='width:100%;height:80px;object-fit:cover;border-radius:10px;margin-top:8px'>":"";div.innerHTML="<div style='display:flex;gap:10px'>"+prof+"<div><div style='font-weight:900'>"+r.fromName+"</div><div>"+r.from+"</div><div style='font-size:11px;color:"+(r.fromHasSelfie?"#00a884":"#c00")+"'>"+(r.fromHasSelfie?"📸 Selfie present":"⚠️ No selfie")+"</div></div></div>"+cover+"<div style='font-size:12px;margin-top:6px'>Do you know this face?</div><div style='display:flex;gap:6px'><button class='kbtn green' style='margin:0;flex:1'>✅ Accept</button><button class='kbtn red' style='margin:0;flex:1'>❌ Decline</button></div>";var btns=div.querySelectorAll("button");btns[0].onclick=async()=>{var me=getMe();await call({action:"respond_request",me:me.phone,requestId:r.id,accept:true});var cs=getContacts();cs.push({id:"p_"+String(r.from).replace("+",""),name:r.fromName,phone:r.from,status:"accepted",profilePic:r.fromProfilePic||"",hasSelfie:!!r.fromHasSelfie});saveContacts(cs);renderList();openChat("p_"+String(r.from).replace("+",""))};btns[1].onclick=async()=>{var me=getMe();await call({action:"respond_request",me:me.phone,requestId:r.id,accept:false});div.remove()};box.appendChild(div)})}
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(async()=>{var me=getMe();if(!me)return;var rr=await call({action:"get_requests",me:me.phone});if(rr&&rr.requests)renderRequests(rr.requests);var cs=getContacts();for(var c of cs){if(c.status==="pending"){var chk=await call({action:"check_request",from:me.phone,to:c.phone});if(chk&&chk.status==="accepted"){c.status="accepted";saveContacts(cs);renderList()}if(chk&&chk.status==="declined"){c.status="declined";saveContacts(cs);renderList()}}}var res=await call({action:"get_messages",me:me.phone,since:lastPoll});if(res&&res.messages){res.messages.forEach(m=>{var cs2=getContacts();var ct=cs2.find(x=>String(x.phone).replace(/\D/g,"")===String(m.from).replace(/\D/g,""));if(!ct){ct={id:"p_"+String(m.from).replace("+",""),name:m.fromName||m.from,phone:m.from,status:"accepted",profilePic:m.fromProfilePic||""};cs2.push(ct);saveContacts(cs2);renderList()}var msgs=getMsgs(ct.id);if(!msgs.find(x=>x.at===m.at)){msgs.push({from:"other",text:m.text,at:m.at});saveMsgs(ct.id,msgs);if(currentId===ct.id)renderMsgs();renderList()}});lastPoll=Date.now()}},2000)}
function addBubble(t,type){var b=document.createElement("div");b.className="bubble "+type;b.textContent=t;el("chat").appendChild(b);el("chat").scrollTop=el("chat").scrollHeight}
function on(id,fn){el(id).onclick=fn}
window.addEventListener("DOMContentLoaded",()=>{
fillSel(el("myCountry"));fillSel(el("pCountry"));
on("btnText",()=>{el("peopleView").classList.remove("show");el("chat").style.display="flex";el("inputArea").style.display="flex";el("btnText").classList.add("active");el("btnPeople").classList.remove("active")});
on("btnPeople",()=>{el("peopleView").classList.add("show");el("peopleView").classList.remove("chatOpen");el("chat").style.display="none";el("inputArea").style.display="none";el("btnPeople").classList.add("active");el("btnText").classList.remove("active");renderList();refreshUI()});
on("profileUploadBtn",()=>el("profileFile").click());on("coverUploadBtn",()=>el("coverFile").click());
el("profileFile").onchange=e=>{var f=e.target.files[0];if(!f)return;compress(f,400,c=>{tempProfile=c;el("profilePreview").innerHTML="<img src='"+c+"'>"});e.target.value=""};
el("coverFile").onchange=e=>{var f=e.target.files[0];if(!f)return;compress(f,800,c=>{tempCover=c;el("coverPreview").innerHTML="<img src='"+c+"'>"});e.target.value=""};
on("profileSelfieBtn",()=>openSelfie("profile"));on("coverSelfieBtn",()=>openSelfie("cover"));
on("captureSelfieBtn",()=>{var v=el("selfieVideo"),cv=el("selfieCanvas");cv.width=v.videoWidth||400;cv.height=v.videoHeight||400;cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);selfieData=cv.toDataURL("image/jpeg",0.7);el("selfiePreviewImg").src=selfieData;el("selfiePreviewImg").style.display="block";el("selfieVideo").style.display="none";el("useSelfieBtn").style.display="block";el("retakeSelfieBtn").style.display="block";el("captureSelfieBtn").style.display="none"});
on("useSelfieBtn",()=>{compress(selfieData,400,c=>{if(selfieTarget==="profile"){tempProfile=c;el("profilePreview").innerHTML="<img src='"+c+"'>"}else{tempCover=c;el("coverPreview").innerHTML="<img src='"+c+"'>"}closeSelfie()})});
on("retakeSelfieBtn",()=>{el("selfieVideo").style.display="block";el("selfiePreviewImg").style.display="none";el("captureSelfieBtn").style.display="block";el("useSelfieBtn").style.display="none";el("retakeSelfieBtn").style.display="none"});
on("closeSelfieBtn",()=>closeSelfie());
on("myRegisterBtn",async()=>{var name=el("myNameInput").value.trim();if(!name)return el("myRegisterStatus").textContent="❌ Type YOUR name";var full=buildPhone(el("myCountry").value,el("myPhoneInput").value.trim());if(full.replace(/\D/g,"").length<7)return el("myRegisterStatus").textContent="❌ Type real number";el("myRegisterStatus").textContent="⏳ Registering...";var res=await call({action:"register",phone:full,name:name,profilePic:tempProfile,coverPic:tempCover});if(!res.ok)return el("myRegisterStatus").textContent="❌ "+(res.msg||"Failed");saveMe({phone:full,name:name,profilePic:tempProfile,coverPic:tempCover});el("myRegisterStatus").textContent="✅ Registered! "+name;refreshUI();renderList();startPolling()});
on("pAddToggleBtn",()=>{el("pAddForm").style.display="block";el("pAddToggleBtn").style.display="none"});
on("pAddCancelBtn",()=>{el("pAddForm").style.display="none";el("pAddToggleBtn").style.display="block"});
on("pAddBtn",async()=>{if(!getMe())return alert("Register first.");var raw=el("pNewPhone").value.trim();var search=raw[0]==="+"?raw:buildPhone(el("pCountry").value,raw);el("pPhoneErr").textContent="⏳ Searching...";var look=await call({action:"lookup",phone:search});if(!look.ok||!look.onTati)return el("pPhoneErr").textContent="❌ Not on Tati yet. Give him link.";var me=getMe();await call({action:"send_request",from:me.phone,to:look.phone});var cs=getContacts();if(cs.find(x=>x.phone===look.phone))return el("pPhoneErr").textContent="⏳ Already sent.";cs.push({id:"p_"+look.phone.replace("+",""),name:look.name,phone:look.phone,status:"pending",profilePic:look.profilePic||"",hasSelfie:!!look.hasSelfie});saveContacts(cs);el("pPhoneErr").textContent="✅ Request sent to "+look.name;el("pNewPhone").value="";el("pAddForm").style.display="none";el("pAddToggleBtn").style.display="block";renderList()});
on("pSendBtn",()=>sendMsg());el("pInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()});
on("sendBtn",()=>{var q=el("textInput").value.trim();if(!q)return;addBubble(q,"user");el("textInput").value="";addBubble("Hi! I am Tati. Go to 👥 People to chat with real people. Your Server is working!","tati")});
addBubble("Hi! I am Tati. Your Server is LIVE. Go to 👥 People → Register with your face.","tati");refreshUI();if(getMe())startPolling();
});
</script></body></html>
