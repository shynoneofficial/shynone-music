 }catch(e){clearTimeout(timeout);isBusy=false;if(e.name!=='AbortError'){addBubble('❌ Network timeout, tap again ⚡','err')}else{addBubble('⏳ Timeout, tap again','err')}return null}
}
async function sendText(){var q=textInput.value.trim();if(!q)return;addBubble(q,'user');textInput.value='';textInput.style.height='auto';var ans=await askGroq(q,false);if(ans)addBubble(ans,'tati')}
var busOn=false,lastBusTime=0,busRec=null;
function toggleBus(){if(busOn){busOn=false;busBtn.textContent='🚌 Bus Mode OFF - Tap to be 6th person';busBtn.classList.remove('on');busLog.textContent='Idle';if(busRec)try{busRec.abort()}catch(e){}return}busOn=true;busBtn.textContent='🚌 Bus Mode ON - Listening as 6th person';busBtn.classList.add('on');busLog.textContent='Listening...';startBusListening()}
function startBusListening(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){busLog.textContent='Not supported';return}busRec=new SR();busRec.continuous=true;busRec.interimResults=true;busRec.lang=(lang==='en')?'en-US':'pt-PT';var finalTxt='';busRec.onresult=function(e){var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)finalTxt+=t+' '; else interim+=t}var all=(finalTxt+interim).toLowerCase();busLog.textContent='Heard: '+all.slice(-40);if(!all)return;var now=Date.now();if(now-lastBusTime<90000)return;
 var funny=/haha|kkk|lol|😂|muito engraçado|funny/i.test(all);
 var price=/\b\d{3,5}\s*(mt|mts|meticais)\b/i.test(all);
 var sad=/triste|chorar|zangado|angry|sad|estou mal/i.test(all);
 var nameAsk=/como te chamas|qual teu nome|what.*name/i.test(all);
 var trigger=null;
 if(funny)trigger='FUNNY';
 else if(price && all.match(/\d+/)){var num=parseInt(all.match(/\d+/)[0]);if(num>4000)trigger='PRICE_LIE'}
 else if(sad)trigger='EMPATHY';
 else if(Object.keys(getNames()).length<3 && all.length>20 && Math.random()>0.7)trigger='ASK_NAME';
 if(trigger){lastBusTime=now;handleBusJump(trigger,finalTxt+interim);finalTxt=''}};
 busRec.onend=function(){if(busOn)setTimeout(startBusListening,800)};busRec.onerror=function(){if(busOn)setTimeout(startBusListening,1500)};try{busRec.start()}catch(e){}}
async function handleBusJump(trigger,heardText){
 var q='';
 if(trigger==='FUNNY')q=`Bus talk: "${heardText}" - This is very funny! Jump in laughing as 6th person, laugh with them.`;
 else if(trigger==='PRICE_LIE')q=`Bus talk: "${heardText}" - Someone said price that is big lie compared to authentic truth. Correct it politely but firmly as 6th person.`;
 else if(trigger==='EMPATHY')q=`Bus talk: "${heardText}" - Someone is sad/angry. Jump with empathy as 6th person.`;
 else if(trigger==='ASK_NAME')q=`Bus talk: "${heardText}" - You hear new voice, you don't know name. Ask their name as 6th person, like real person would.`;
 busLog.textContent='Jumping: '+trigger;
 var ans=await askGroq(q,true);
 if(ans){addBubble('🚌 [6th person - '+trigger+'] '+heardText,'user');addBubble(ans,'tati');speak(ans);if(trigger==='ASK_NAME'){var maybe=heardText.match(/(?:sou|chamo|meu nome é)\s+(\w+)/i);if(maybe)saveName(Date.now(),maybe[1])}}
}
async function tapVoice(){if(isSpeaking){try{speechSynthesis.cancel()}catch(e){}isSpeaking=false;bigPic.classList.remove('talking');voiceBtnBig.classList.remove('listening');voiceBtnBig.textContent='🎤';voiceStatus.innerHTML=LANGS[lang].voiceIdle;return}if(isListening)return;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceStatus.innerHTML='Voice not supported';return}isListening=true;voiceBtnBig.classList.add('listening');voiceBtnBig.textContent='🔴';bigPic.classList.add('listening');voiceStatus.textContent=LANGS[lang].listening;if(rec)try{rec.abort()}catch(e){}rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang=(lang==='pt'||lang==='ch')?'pt-PT':'en-US';var heard='';rec.onresult=function(e){heard=e.results[0][0].transcript};rec.onend=async function(){isListening=false;voiceBtnBig.classList.remove('listening');voiceBtnBig.textContent='🎤';bigPic.classList.remove('listening');if(!heard){voiceStatus.innerHTML='Did not hear';return}voiceStatus.textContent=LANGS[lang].thinking+' "'+heard+'"';var ans=await askGroq(heard,false);if(ans){voiceStatus.textContent=ans;addBubble(heard,'user');addBubble(ans,'tati');speak(ans)}else voiceStatus.innerHTML=LANGS[lang].voiceIdle};rec.onerror=function(e){isListening=false;voiceBtnBig.classList.remove('listening');voiceBtnBig.textContent='🎤';bigPic.classList.remove('listening');voiceStatus.innerHTML='Mic error'};try{rec.start()}catch(e){isListening=false}}
function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||EMBEDDED_KEY||'';authInput.value=localStorage.getItem('tati_auth_truth')||'';kstatus.textContent=(localStorage.getItem('groq_key')||EMBEDDED_KEY)?'Key saved ✓':'Offline memory mode';}
document.addEventListener('DOMContentLoaded',init);
