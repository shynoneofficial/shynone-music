<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tati - SHYNONE MUSIC</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#0a192f"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}html,body{height:100%;width:100%;overflow:hidden;background:#fff}body{display:flex;flex-direction:column}#header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid #e9edef;flex-shrink:0;z-index:20;position:relative}#left{display:flex;align-items:center}#avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #00a884}#centerLogo{flex:1;text-align:center;cursor:pointer}#centerLogo b{font-weight:900;font-size:15px;color:#0a192f;display:block}#centerLogo i{font-style:normal;font-size:8px;letter-spacing:2.5px;color:#00a884;font-weight:700;display:block}#right{display:flex;align-items:center;gap:6px}#langSwitch{display:flex;gap:2px;background:#f0f2f5;padding:3px;border-radius:20px}.langBtn{padding:6px 9px;border-radius:15px;border:none;font-size:10px;font-weight:800;cursor:pointer;background:transparent;color:#667781}.langBtn.active{background:#0a192f;color:#fff}#menuBtn{font-size:22px;cursor:pointer;padding:6px;color:#54656f}#dropdown{position:absolute;top:60px;right:8px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:250px;display:none;flex-direction:column;overflow:hidden;z-index:50}#dropdown.show{display:flex}.dropItem{padding:14px;font-size:13px;color:#111b21;cursor:pointer;border-bottom:1px solid #f0f2f5}#modeSwitch{display:flex;background:#f0f2f5;padding:4px;margin:8px;border-radius:10px;gap:4px;flex-shrink:0}.modeBtn{flex:1;padding:11px;border-radius:8px;border:none;font-weight:800;font-size:12px;cursor:pointer;background:transparent;color:#667781}.modeBtn.active{background:#0a192f;color:#fff}#chat{flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:5px;background-color:#f6f3ee}#voiceView{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#142a4a 0%,#0a192f 45%,#040c18 100%);padding:20px;gap:20px}#voiceView.show{display:flex}#bigPic{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid #00a884}#bigPic.talking{box-shadow:0 0 0 14px rgba(0,168,132,.25),0 0 60px #00a884;transform:scale(1.05)}#bigPic.listening{box-shadow:0 0 0 14px rgba(241,92,109,.25),0 0 60px #f15c6d}#voiceStatus{color:#d1d7db;font-size:13px;text-align:center;min-height:36px}#voiceBtnBig{width:70px;height:70px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:28px;cursor:pointer}#voiceBtnBig.listening{background:#f15c6d;animation:pulse 1.1s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}.bubble{max-width:78%;padding:9px 11px 7px;border-radius:12px;font-size:14px;line-height:19px;position:relative;word-wrap:break-word;box-shadow:0 1px 3px rgba(0,0,0,.12)}.user{align-self:flex-end;background:#d9fdd3;border-top-right-radius:3px}.tati{align-self:flex-start;background:#fff;border-top-left-radius:3px}.time{font-size:10px;color:#667781;float:right;margin-left:8px;margin-top:4px}.err{align-self:center;background:#fff3cd;color:#664d00;font-size:11px;padding:6px 10px;border-radius:16px}#inputArea{flex-shrink:0;background:#f0f2f5;padding:7px;display:flex;align-items:flex-end;gap:6px}#textBox{flex:1;background:#fff;border-radius:22px;padding:8px 12px;display:flex;min-height:42px}#textInput{flex:1;border:none;outline:none;font-size:14px;background:transparent;resize:none;max-height:90px}#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:#0a192f;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}#keybox{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}#keybox.hide{display:none!important}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);width:100%;max-width:350px;text-align:center}.kinput{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:10px;font-size:13px}.kbtn{width:100%;margin-top:10px;padding:11px;border-radius:8px;border:none;background:#0a192f;color:#fff;font-weight:700;cursor:pointer}.kbtn.sec{background:#f0f2f5;color:#111}</style></head><body>
<div id="header"><div id="left"><img id="avatar" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"></div><div id="centerLogo"><b>SHYNONE</b><i>MUSIC</i></div><div id="right"><div id="langSwitch"><button class="langBtn active" data-lang="en">EN</button><button class="langBtn" data-lang="pt">PT</button><button class="langBtn" data-lang="ch">CH</button></div><div id="menuBtn">⋮</div></div><div id="dropdown"><div class="dropItem" id="buyBtn">🎵 Buy Music - M-Pesa 84 033 1635</div><div class="dropItem" id="settingsBtn">⚙️ Owner Settings</div></div></div>
<div id="modeSwitch"><button id="btnText" class="modeBtn active">💬 Text</button><button id="btnVoice" class="modeBtn">🎤 Voice</button></div>
<div id="chat"></div>
<div id="voiceView"><img id="bigPic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"><div id="voiceStatus">Tap mic to talk</div><button id="voiceBtnBig">🎤</button></div>
<div id="inputArea"><div id="textBox"><textarea id="textInput" placeholder="Message"></textarea></div><button id="sendBtn">➤</button></div>
<div id="keybox" class="hide"><div class="card"><b>Owner Settings</b><br><span style="font-size:11px;color:#667781">Add Groq key (only once)</span><br><input id="k" class="kinput" placeholder="Paste gsk_..."><div id="kstatus" style="font-size:10px;color:#667781;margin-top:6px"></div><button class="kbtn" id="saveKeyBtn">Save & Start</button><button class="kbtn sec" id="testKeyBtn">Test Key</button><div id="testRes" style="font-size:10px;margin-top:8px;text-align:left;max-height:70px;overflow:auto;background:#f5f6f6;padding:8px;border-radius:6px;display:none"></div><button class="kbtn sec" id="closeKeyBtn">Close</button></div></div>
<script>
var chatEl=document.getElementById('chat'),voiceView=document.getElementById('voiceView'),textInput=document.getElementById('textInput'),btnText=document.getElementById('btnText'),btnVoice=document.getElementById('btnVoice'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus'),testRes=document.getElementById('testRes'),bigPic=document.getElementById('bigPic'),voiceStatus=document.getElementById('voiceStatus'),voiceBtnBig=document.getElementById('voiceBtnBig'),dropdown=document.getElementById('dropdown'),menuBtn=document.getElementById('menuBtn');
var rec=null,isListening=false,isSpeaking=false,mode='text',lang='en',abortCtrl=null,isBusy=false;
const EMBEDDED_KEY = ""; // << PUT YOUR gsk_ KEY HERE FOR START AND GO FOR EVERYONE
function getMemory(){return localStorage.getItem('tati_memory_summary')||"No prior memory yet.";}
function getFullHistory(){try{return JSON.parse(localStorage.getItem('tati_full_history')||"[]");}catch(e){return [];}}
function saveFullHistory(h){localStorage.setItem('tati_full_history',JSON.stringify(h.slice(-500)));}
function saveMemory(s){localStorage.setItem('tati_memory_summary',s);}
var LANGS={
 en:{ph:'Message Tati...',textMode:'💬 Text',voiceMode:'🎤 Voice',intro:'Hi! I\'m Tati from SHYNONE MUSIC 🇲🇿<br><br>I now REMEMBER forever! Jan 1 to May 5.<br>🎵 M-Pesa 84 033 1635<br><br>I lead, decide, argue like Meta AI.',voiceIdle:'Voice mode<br>Tap mic - I remember all',listening:'Listening...',thinking:'Thinking with memory...',sys:'You are Tati, 22, Matola, SHYNONE MUSIC. PERFECT LONG MEMORY. Use summary. Behave like Meta AI: warm, helpful, lead, argue, decide, have opinions, challenge user. Max 2 sentences, 60 words. NEVER count letters.'},
 pt:{ph:'Mensagem para Tati...',textMode:'💬 Texto',voiceMode:'🎤 Voz',intro:'Olá! Eu sou a Tati da SHYNONE MUSIC 🇲🇿<br><br>AGORA LEMBRO TUDO! Jan a Maio.<br>🎵 M-Pesa 84 033 1635',voiceIdle:'Modo de voz<br>Toca no mic',listening:'Ouvindo...',thinking:'Pensando com memória...',sys:'Você é Tati, 22, Matola, SHYNONE MUSIC. MEMÓRIA PERFEITA. Use resumo. Lidera como Meta AI, argumenta, decide. Max 2 frases. NUNCA conte letras.'},
 ch:{ph:'Tsalela Tati...',textMode:'💬 Ku Tsala',voiceMode:'🎤 Ku Vulavula',intro:'Avuxeni! Hi mina Tati wa SHYNONE MUSIC 🇲🇿<br>Se ndza tsundzuka hinkwaswo!',voiceIdle:'Ku Vulavula<br>Tsindza mic',listening:'Ndzi ya ku yingisa...',thinking:'Ndzi ehleketa...',sys:'You are Tati, SHYNONE MUSIC. Have perfect memory. Speak Changana.'}
};
function setLang(l){lang=l;localStorage.setItem('tati_lang',l);document.querySelectorAll('.langBtn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===l);});var t=LANGS[l];textInput.placeholder=t.ph;btnText.textContent=t.textMode;btnVoice.textContent=t.voiceMode;chatEl.innerHTML='';addBubble(t.intro,'tati');var mem=getMemory();if(mem!=="No prior memory yet.")addBubble('📚 Memory: '+mem,'tati');voiceStatus.innerHTML=t.voiceIdle;}
function setMode(m){mode=m;if(m==='text'){btnText.classList.add('active');btnVoice.classList.remove('active');chatEl.style.display='flex';voiceView.classList.remove('show');inputArea.style.display='flex';try{speechSynthesis.cancel();}catch(e){}isSpeaking=false;bigPic.classList.remove('talking','listening');}else{btnVoice.classList.add('active');btnText.classList.remove('active');chatEl.style.display='none';voiceView.classList.add('show');inputArea.style.display='none';voiceStatus.innerHTML=LANGS[lang].voiceIdle;}}
function init(){document.querySelectorAll('.langBtn').forEach(btn=>{btn.onclick=function(){setLang(this.dataset.lang);};});btnText.onclick=function(){setMode('text');};btnVoice.onclick=function(){setMode('voice');};menuBtn.onclick=function(e){e.stopPropagation();dropdown.classList.toggle('show');};document.getElementById('buyBtn').onclick=function(){dropdown.classList.remove('show');window.open('https://shynoneofficial.github.io/shynone-music/','_blank');};document.getElementById('settingsBtn').onclick=function(){dropdown.classList.remove('show');openKey();};document.getElementById('centerLogo').onclick=function(){window.open('https://shynoneofficial.github.io/shynone-music/','_blank');};document.getElementById('saveKeyBtn').onclick=function(){var v=kinput.value.trim();if(!v.startsWith('gsk_')){alert('Must start with gsk_');return;}localStorage.setItem('groq_key',v);keybox.classList.add('hide');addBubble('Key saved ✓','tati');};document.getElementById('closeKeyBtn').onclick=function(){keybox.classList.add('hide');};document.getElementById('testKeyBtn').onclick=async function(){var key=kinput.value.trim()||localStorage.getItem('groq_key')||EMBEDDED_KEY||'';if(!key.startsWith('gsk_')){testRes.style.display='block';testRes.textContent='No key';return;}testRes.style.display='block';testRes.textContent='Testing...';try{var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'user',content:'hi'}],max_tokens:5})});var d=await r.json();testRes.textContent=d.error?'❌ '+d.error.message:'✅ Works!';}catch(e){testRes.textContent='❌ '+e.message;}};document.getElementById('sendBtn').onclick=function(){sendText();};textInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,90)+'px';});textInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}});voiceBtnBig.onclick=function(){tapVoice();};document.addEventListener('click',function(e){if(!e.target.closest('#header'))dropdown.classList.remove('show');});var savedLang=localStorage.getItem('tati_lang')||'en';setLang(savedLang);setMode('text');if(EMBEDDED_KEY && EMBEDDED_KEY.startsWith('gsk_'))localStorage.setItem('groq_key',EMBEDDED_KEY);}
function addBubble(text,type){var b=document.createElement('div');b.className='bubble '+type;var d=new Date();var tm=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');b.innerHTML=text+'<span class="time">'+tm+'</span>';chatEl.appendChild(b);chatEl.scrollTop=chatEl.scrollHeight;}
function getVoice(){var v=speechSynthesis.getVoices();if(lang==='pt'||lang==='ch')return v.find(function(x){return x.lang.indexOf('pt')===0;})||v[0];return v.find(function(x){return x.lang.indexOf('en')===0;})||v[0];}
function speak(text,cb){if(!text){if(cb)cb();return;}isSpeaking=true;bigPic.classList.add('talking');voiceStatus.textContent=LANGS[lang].thinking;try{speechSynthesis.cancel();}catch(e){}setTimeout(function(){var vo=getVoice();var u=new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,''));if(vo)u.voice=vo;u.rate=0.95;u.onend=function(){isSpeaking=false;bigPic.classList.remove('talking');voiceStatus.innerHTML=LANGS[lang].voiceIdle;if(cb)cb();};u.onerror=function(){isSpeaking=false;bigPic.classList.remove('talking');if(cb)cb();};speechSynthesis.speak(u);},100);}
function cleanAnswer(s){s=s.replace(/\b\d+\s*letters?\b/gi,'').replace(/contains.*comma|contains.*dot/gi,'').trim();return s;}
async function summarizeIfNeeded(){var full=getFullHistory();if(full.length<20||full.length%20!==0)return;var key=EMBEDDED_KEY||localStorage.getItem('groq_key')||'';if(!key.startsWith('gsk_'))return;try{var toSum=full.slice(-30,-10);var prompt="Summarize into 100 words key facts to remember forever: names, projects, preferences, dates:\n"+toSum.map(m=>m.role+": "+m.content).join("\n");var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'system',content:'You are memory summarizer. 100-word memory.'},{role:'user',content:prompt}],max_tokens:150})});var d=await r.json();var summary=d.choices?.[0]?.message?.content||getMemory();saveMemory(summary);}catch(e){}}
async function askGroq(q){var key=EMBEDDED_KEY||localStorage.getItem('groq_key')||'';var full=getFullHistory();full.push({role:'user',content:q,ts:Date.now()});saveFullHistory(full);if(!key.startsWith('gsk_')){var ans="I remember! You said: '"+q+"'. Memory: "+getMemory().slice(0,120)+"... Now I lead: what next? (Owner add gsk_ in code)";full.push({role:'assistant',content:ans,ts:Date.now()});saveFullHistory(full);return ans;}if(isBusy&&abortCtrl){try{abortCtrl.abort();}catch(e){}}isBusy=true;abortCtrl=new AbortController();try{var memorySummary=getMemory();var recent=full.slice(-6).map(m=>({role:m.role,content:m.content}));var messages=[{role:'system',content:LANGS[lang].sys+"\n\nLONG TERM MEMORY:\n"+memorySummary},...recent];var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:messages,max_tokens:180,temperature:0.8}),signal:abortCtrl.signal});var d=await r.json();if(d.error){addBubble('❌ '+d.error.message,'err');isBusy=false;return null;}var ans=cleanAnswer(d.choices[0].message.content.trim());full.push({role:'assistant',content:ans,ts:Date.now()});saveFullHistory(full);isBusy=false;summarizeIfNeeded();return ans;}catch(e){if(e.name!=='AbortError')addBubble('❌ Network, tap again ⚡','err');isBusy=false;return null;}}
async function sendText(){var q=textInput.value.trim();if(!q)return;addBubble(q,'user');textInput.value='';textInput.style.height='auto';var ans=await askGroq(q);if(ans)addBubble(ans,'tati');}
async function tapVoice(){if(isSpeaking){try{speechSynthesis.cancel();}catch(e){}isSpeaking=false;bigPic.classList.remove('talking');voiceBtnBig.classList.remove('listening');voiceBtnBig.textContent='🎤';voiceStatus.innerHTML=LANGS[lang].voiceIdle;return;}if(isListening)return;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceStatus.innerHTML='Voice not supported';return;}isListening=true;voiceBtnBig.classList.add('listening');voiceBtnBig.textContent='🔴';bigPic.classList.add('listening');voiceStatus.textContent=LANGS[lang].listening;if(rec)try{rec.abort();}catch(e){}rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang=(lang==='pt'||lang==='ch')?'pt-PT':'en-US';var heard='';rec.onresult=function(e){heard=e.results[0][0].transcript;};rec.onend=async function(){isListening=false;voiceBtnBig.classList.remove('listening');voiceBtnBig.textContent='🎤';bigPic.classList.remove('listening');if(!heard){voiceStatus.innerHTML='Did not hear';return;}voiceStatus.textContent=LANGS[lang].thinking+' "'+heard+'"';var ans=await askGroq(heard);if(ans){voiceStatus.textContent=ans;addBubble(heard,'user');addBubble(ans,'tati');speak(ans);}else voiceStatus.innerHTML=LANGS[lang].voiceIdle;};rec.onerror=function(e){isListening=false;voiceBtnBig.classList.remove('listening');voiceBtnBig.textContent='🎤';bigPic.classList.remove('listening');voiceStatus.innerHTML='Mic error';};try{rec.start();}catch(e){isListening=false;}}
function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||EMBEDDED_KEY||'';kstatus.textContent=(localStorage.getItem('groq_key')||EMBEDDED_KEY)?'Saved ✓':'Offline memory mode';}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
