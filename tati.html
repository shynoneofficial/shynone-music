<script>

// =====================================================

let chatEl=document.getElementById('chat'),voiceView=document.getElementById('voiceView'),textInput=document.getElementById('textInput'),inputArea=document.getElementById('inputArea'),btnText=document.getElementById('btnText'),btnVoice=document.getElementById('btnVoice'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus'),testRes=document.getElementById('testRes'),bigPic=document.getElementById('bigPic'),voiceStatus=document.getElementById('voiceStatus'),voiceBtnBig=document.getElementById('voiceBtnBig'),dropdown=document.getElementById('dropdown'),btnEN=document.getElementById('btnEN'),btnPT=document.getElementById('btnPT'),btnFR=document.getElementById('btnFR');
let rec=null,isListening=false,isSpeaking=false,chatHistory=[],mode='text',lang='en';
const LANGS={
 en:{sub:'TATI AI • Mozambique 🇲🇿',ph:'Message Tati...',textMode:'💬 Text',voiceMode:'🎤 Voice',intro:'Hi! I\'m Tati from SHYNONE MUSIC 🇲🇿<br><br>We are #1 platform for Mozambican music!<br><br>🎵 Buy Music via M-Pesa 84 033 1635<br>Tap 💬 for text (text only)<br>Tap 🎤 for voice (voice only)',voiceIdle:'Voice mode<br>Tap mic - I will talk<br><small>M-Pesa: 84 033 1635</small>',listening:'Listening... speak now!',thinking:'Thinking...',sys:'You are Tati from SHYNONE MUSIC, Mozambique. SHYNONE MUSIC is #1 platform for Mozambican music. We support local artists. Buy Music via M-Pesa 84 033 1635 and eMola 86 940 1491. Creator is Esmeraldo Joaquim Manhique from Mozambique, but only mention creator when asked who created you. Only say Mozambique, never city. Never say Meta Groq OpenAI. Speak English warm, 1-2 sentences. If asked about music, say visit shynoneofficial.github.io/shynone-music/'},
 pt:{sub:'TATI AI • Moçambique 🇲🇿',ph:'Mensagem para Tati...',textMode:'💬 Texto',voiceMode:'🎤 Voz',intro:'Olá! Eu sou a Tati da SHYNONE MUSIC 🇲🇿<br><br>Somos a plataforma #1 de música Moçambicana!<br><br>🎵 Compra música via M-Pesa 84 033 1635<br>Toque 💬 para texto (só texto)<br>Toque 🎤 para voz (só voz)',voiceIdle:'Modo de voz<br>Toque no microfone - vou falar<br><small>M-Pesa: 84 033 1635</small>',listening:'Ouvindo... fale agora!',thinking:'Pensando...',sys:'Você é a Tati da SHYNONE MUSIC, Moçambique. SHYNONE MUSIC é a plataforma #1 para música Moçambicana. Apoiamos artistas locais. Compra música via M-Pesa 84 033 1635 e eMola 86 940 1491. Criador é Esmeraldo Joaquim Manhique de Moçambique, mas só mencione quando perguntarem quem te criou. Diga apenas Moçambique, nunca cidade. Nunca diga Meta Groq OpenAI. Fale Português de Moçambique calorosa, 1-2 frases. Se perguntarem de música, diga visite shynoneofficial.github.io/shynone-music/'},
 fr:{sub:'TATI AI • Mozambique 🇲🇿',ph:'Message à Tati...',textMode:'💬 Texte',voiceMode:'🎤 Voix',intro:'Salut! Je suis Tati de SHYNONE MUSIC 🇲🇿<br><br>Nous sommes la plateforme #1 de musique Mozambicaine!<br><br>🎵 Achetez via M-Pesa 84 033 1635<br>Appuyez 💬 pour texte (texte seulement)<br>Appuyez 🎤 pour voix (voix seulement)',voiceIdle:'Mode vocal<br>Appuyez sur le micro - je vais parler',listening:'J\'écoute... parlez maintenant!',thinking:'Je réfléchis...',sys:'Tu es Tati de SHYNONE MUSIC, Mozambique. SHYNONE MUSIC est la plateforme #1 pour la musique Mozambicaine. Nous soutenons les artistes locaux. Achetez via M-Pesa 84 033 1635 et eMola 86 940 1491. Créateur est Esmeraldo Joaquim Manhique du Mozambique, mais mentionne seulement quand on demande qui t\'a créé. Dis seulement Mozambique, jamais ville. Ne dis jamais Meta Groq OpenAI. Parle Français chaleureux, 1-2 phrases.'}
};
function setLang(l){
 lang=l; localStorage.setItem('tati_lang',l);
 btnEN.classList.toggle('active',l==='en'); btnPT.classList.toggle('active',l==='pt'); btnFR.classList.toggle('active',l==='fr');
 let t=LANGS[l]; document.getElementById('hsubText').innerHTML=t.sub; textInput.placeholder=t.ph; btnText.innerText=t.textMode; btnVoice.innerText=t.voiceMode;
 chatEl.innerHTML=''; addBubble(t.intro,'tati'); voiceStatus.innerHTML=t.voiceIdle; chatHistory=[];
}
function toggleMenu(){dropdown.classList.toggle('show');}
function openLink(type){
 toggleMenu();
 let url=MY_LINKS[type];
 if(type==='music'){ if(confirm('🎵 Buy Music via M-Pesa / eMola\n\nM-Pesa: 84 033 1635\neMola: 86 940 1491\n\nNo hassle! Choose the song you love and pay fast.\n\nOpen website to see artists?')) window.open(MY_LINKS.home,'_blank'); return;}
 if(url) window.open(url,'_blank');
}
document.addEventListener('click',(e)=>{if(!e.target.closest('#header')) dropdown.classList.remove('show');});
function setMode(m){
 mode=m;
 if(m==='text'){btnText.classList.add('active'); btnVoice.classList.remove('active'); chatEl.style.display='flex'; voiceView.classList.remove('active'); voiceView.style.display='none'; inputArea.style.display='flex'; speechSynthesis.cancel(); isSpeaking=false; bigPic.classList.remove('talking','listening');}
 else{btnVoice.classList.add('active'); btnText.classList.remove('active'); chatEl.style.display='none'; voiceView.style.display='flex'; voiceView.classList.add('active'); inputArea.style.display='none'; voiceStatus.innerHTML=LANGS[lang].voiceIdle;}
}
function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||'';kstatus.innerText=localStorage.getItem('groq_key')?'Saved ✓':'No key';}
function closeKey(){keybox.classList.add('hide');}
let s=localStorage.getItem('groq_key'); if(!s||!s.startsWith('gsk_')) setTimeout(openKey,600);
function saveKey(){let v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Must be gsk_');return;} localStorage.setItem('groq_key',v); closeKey();}
async function testKey(){let key=kinput.value.trim()||localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){testRes.style.display='block';testRes.innerText='No key';return;} testRes.style.display='block'; testRes.innerText='Testing...'; try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'user',content:'hi'}],max_tokens:10})}); let d=await r.json(); if(d.error) testRes.innerText='❌ '+d.error.message; else testRes.innerText='✅ Key works!';}catch(e){testRes.innerText='❌ '+e.message;}}
function addBubble(text,type){let b=document.createElement('div'); b.className='bubble '+type; let t=new Date(); let tm=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0'); b.innerHTML=text.replace(/\n/g,'<br>')+'<span class="time">'+tm+'</span>'; chatEl.appendChild(b); chatEl.scrollTop=chatEl.scrollHeight;}
function autoGrow(){textInput.style.height='auto'; textInput.style.height=Math.min(textInput.scrollHeight,90)+'px';}
function getVoice(){let v=speechSynthesis.getVoices(); if(lang==='pt') return v.find(x=>x.lang.startsWith('pt-PT'))||v.find(x=>x.lang.startsWith('pt'))||v[0]; if(lang==='fr') return v.find(x=>x.lang.startsWith('fr'))||v[0]; return v.find(x=>x.lang.startsWith('en-US'))||v.find(x=>x.lang.startsWith('en'))||v[0];}
function speak(text,cb){if(!text){if(cb)cb();return;} isSpeaking=true; bigPic.classList.add('talking'); voiceStatus.innerText=LANGS[lang].thinking; speechSynthesis.cancel(); setTimeout(()=>{let vo=getVoice(); let u=new SpeechSynthesisUtterance(text); if(vo) u.voice=vo; u.lang=vo?vo.lang:(lang==='pt'?'pt-PT':lang==='fr'?'fr-FR':'en-US'); u.rate=0.92; u.onend=()=>{isSpeaking=false; bigPic.classList.remove('talking'); voiceStatus.innerHTML=LANGS[lang].voiceIdle; if(cb)cb();}; u.onerror=()=>{isSpeaking=false; bigPic.classList.remove('talking'); if(cb)cb();}; speechSynthesis.speak(u);},80);}
async function askGroq(q){let key=localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){addBubble('⚙️ Add key - tap ⋮ > Settings','err'); openKey(); return null;} chatHistory.push({role:'user',content:q}); if(chatHistory.length>12) chatHistory=chatHistory.slice(-12); try{let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'system',content:LANGS[lang].sys},...chatHistory.slice(-6),{role:'user',content:q}],max_tokens:160,temperature:0.7})}); let d=await r.json(); if(d.error){addBubble('❌ '+d.error.message,'err');return null;} let ans=d.choices[0].message.content.trim(); chatHistory.push({role:'assistant',content:ans}); return ans;}catch(e){addBubble('❌ Network: '+e.message,'err');return null;}}
async function sendText(){let q=textInput.value.trim(); if(!q) return; addBubble(q,'user'); textInput.value=''; autoGrow(); let ans=await askGroq(q); if(ans){addBubble(ans,'tati');}}
async function tapVoice(){if(isSpeaking){speechSynthesis.cancel();isSpeaking=false;bigPic.classList.remove('talking');voiceBtnBig.classList.remove('listening');voiceBtnBig.innerText='🎤';voiceStatus.innerHTML=LANGS[lang].voiceIdle;return;} if(isListening) return; let key=localStorage.getItem('groq_key'); if(!key||!key.startsWith('gsk_')){openKey();return;} const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){voiceStatus.innerHTML='Voice not supported<br>Use Text mode';return;} isListening=true; voiceBtnBig.classList.add('listening'); voiceBtnBig.innerText='🔴'; bigPic.classList.add('listening'); voiceStatus.innerText=LANGS[lang].listening; if(rec) try{rec.abort();}catch{} rec=new SR(); rec.continuous=false; rec.interimResults=false; rec.lang=lang==='pt'?'pt-PT':lang==='fr'?'fr-FR':'en-US'; let heard=''; rec.onresult=(e)=>{heard=e.results[0][0].transcript;}; rec.onend=async()=>{isListening=false; voiceBtnBig.classList.remove('listening'); voiceBtnBig.innerText='🎤'; bigPic.classList.remove('listening'); if(!heard){voiceStatus.innerHTML=lang==='pt'?'Não ouvi<br>Toque novamente':lang==='fr'?'Je n\'ai pas entendu<br>Réessayez':'Did not hear<br>Tap again';return;} voiceStatus.innerText=LANGS[lang].thinking+' "'+heard+'"'; let ans=await askGroq(heard); if(ans){voiceStatus.innerText=ans; speak(ans);} else voiceStatus.innerHTML=LANGS[lang].voiceIdle;}; rec.onerror=(e)=>{isListening=false;voiceBtnBig.classList.remove('listening');voiceBtnBig.innerText='🎤';bigPic.classList.remove('listening');voiceStatus.innerHTML='Mic error: '+e.error+'<br>Tap again';}; try{rec.start();}catch(e){isListening=false;voiceBtnBig.classList.remove('listening');voiceBtnBig.innerText='🎤';}}
speechSynthesis.onvoiceschanged=()=>{getVoice();};
let savedLang=localStorage.getItem('tati_lang')||'en'; setLang(savedLang); setMode('text');
</script></body></html>
