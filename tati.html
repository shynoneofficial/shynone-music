<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tati V31 Voice + Text</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column} #header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#0a0a0a;border-bottom:1px solid #222} #name{font-size:18px;font-weight:800;letter-spacing:3px} #gear{font-size:20px;cursor:pointer} #main{flex:1;display:flex;flex-direction:column;overflow:hidden} #picWrap{display:flex;flex-direction:column;align-items:center;padding:15px 0 10px} #pic{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid #fff;cursor:pointer;transition:.2s} #pic.listening{box-shadow:0 0 0 12px rgba(0,230,118,.4),0 0 60px #00e676;transform:scale(1.05)} #pic.talking{box-shadow:0 0 0 12px rgba(74,109,167,.4),0 0 60px #4a6da7} #status{font-size:10px;opacity:.6;margin-top:8px;text-align:center} #chat{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#050505} .msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.3;word-break:break-word} .user{background:#00e676;color:#000;align-self:flex-end;border-bottom-right-radius:4px} .tati{background:#1a233a;color:#fff;align-self:flex-start;border-bottom-left-radius:4px} .error{background:#3a1a1a;color:#ff6b6b;align-self:center;font-size:11px} #controls{padding:10px;background:#0a0a0a;border-top:1px solid #222;display:flex;flex-direction:column;gap:8px} #voiceRow{display:flex;gap:8px} #voiceBtn{flex:1;padding:12px;border-radius:25px;border:none;background:#00e676;color:#000;font-weight:900;font-size:14px;cursor:pointer} #voiceBtn.stop{background:#ff3b30;color:#fff} #textRow{display:flex;gap:8px} #textInput{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #333;background:#111;color:#fff;font-size:14px;outline:none} #sendBtn{padding:12px 18px;border-radius:25px;border:none;background:#4a6da7;color:#fff;font-weight:800;cursor:pointer} #keybox{position:fixed;inset:0;background:rgba(0,0,0,.97);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99} #keybox.hide{display:none} .card{background:#121a2a;padding:20px;border-radius:18px;width:100%;max-width:360px;text-align:center} input.kinput{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:12px;font-size:12px;box-sizing:border-box} button.kbtn{width:100%;margin-top:12px;padding:12px;border-radius:20px;border:none;background:#00e676;font-weight:900;color:#000;cursor:pointer}</style></head><body>
<div id="header"><div id="name">Tati</div><div id="gear" onclick="openKey()">⚙️</div></div>
<div id="main">
<div id="picWrap"><img id="pic" src="./Tate.jpg" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400&h=400&fit=crop'"><div id="status">V31 - Voice + Text - Mozambique</div></div>
<div id="chat"><div class="msg tati">Hi! I'm Tati from Mozambique! Created by Esmeraldo Joaquim Manhique! Tap mic to talk or type below! 💬</div></div>
<div id="controls">
<div id="voiceRow"><button id="voiceBtn" onclick="tapVoice()">🎤 TAP TO TALK</button></div>
<div id="textRow"><input id="textInput" placeholder="Type message to Tati..." onkeydown="if(event.key==='Enter')sendText()"><button id="sendBtn" onclick="sendText()">Send</button></div>
</div>
</div>
<div id="keybox" class="hide"><div class="card">
<b>Tati V31 - Mozambique</b><br><span style="font-size:11px;opacity:.7">Voice + Text Chat - Real Groq Only</span><br><br>
<input id="k" class="kinput" placeholder="Paste gsk_ key"><div id="kstatus" style="font-size:10px;opacity:.5;margin-top:8px"></div>
<button class="kbtn" onclick="save()">Save Key</button>
<button class="kbtn" style="background:#4a6da7;color:#fff" onclick="testKey()">Test Groq Key</button>
<div id="testResult" style="font-size:10px;margin-top:10px;word-break:break-word;text-align:left;max-height:100px;overflow:auto"></div>
<button class="kbtn" style="background:#222;color:#fff" onclick="closeKey()">Close</button>
</div></div>
<script>
let pic=document.getElementById('pic'),voiceBtn=document.getElementById('voiceBtn'),statusEl=document.getElementById('status'),chatEl=document.getElementById('chat'),textInput=document.getElementById('textInput'),keybox=document.getElementById('keybox'),kinput=document.getElementById('k'),kstatus=document.getElementById('kstatus'),testResult=document.getElementById('testResult');
let rec=null,isListening=false,isSpeaking=false,chatHistory=[];

function openKey(){keybox.classList.remove('hide');kinput.value=localStorage.getItem('groq_key')||'';kstatus.innerText=localStorage.getItem('groq_key')?'Saved: '+localStorage.getItem('groq_key').substring(0,12)+'...':'No key';}
function closeKey(){keybox.classList.add('hide');}
let saved=localStorage.getItem('groq_key'); if(!saved||!saved.startsWith('gsk_')) setTimeout(openKey,500);

function save(){let v=kinput.value.trim(); if(!v.startsWith('gsk_')){alert('Must start with gsk_');return;} localStorage.setItem('groq_key',v); closeKey(); addMsg('Key saved! Now chat with Tati','tati');}
async function testKey(){
  let key=kinput.value.trim()||localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){testResult.innerText='No valid gsk_ key';return;}
  testResult.innerText='Testing...';
  try{
    let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'user',content:'Hi'}],max_tokens:20})});
    let d=await r.json(); testResult.innerText=JSON.stringify(d).substring(0,400);
    if(d.error) testResult.innerText='❌ ERROR: '+d.error.message; else testResult.innerText='✅ SUCCESS: '+d.choices[0].message.content+' - Key works!';
  }catch(e){testResult.innerText='❌ FETCH ERROR: '+e.message;}
}

function addMsg(text,type){let d=document.createElement('div');d.className='msg '+type;d.innerText=text;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}

function getVoice(){let v=speechSynthesis.getVoices();return v.find(x=>x.lang.startsWith('pt-PT'))||v.find(x=>x.lang.startsWith('pt'))||v.find(x=>x.name.includes('Female'))||v[0];}

function speak(text){
  if(!text) return;
  isSpeaking=true; voiceBtn.innerText='🔊 SPEAKING - TAP TO STOP'; voiceBtn.className='stop'; pic.classList.add('talking'); statusEl.innerText='Tati speaking...';
  speechSynthesis.cancel();
  setTimeout(()=>{
    let vo=getVoice();
    let u=new SpeechSynthesisUtterance(text);
    if(vo) u.voice=vo; u.lang=vo.lang||'en-US'; u.rate=0.9;
    u.onend=()=>{isSpeaking=false;pic.classList.remove('talking');voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';statusEl.innerText='Tap to talk or type';};
    u.onerror=()=>{isSpeaking=false;pic.classList.remove('talking');voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';};
    speechSynthesis.speak(u);
  },50);
}

async function askGroq(q){
  let key=localStorage.getItem('groq_key')||''; if(!key.startsWith('gsk_')){addMsg('No Groq key! Click ⚙️ gear to add key','error');openKey();return null;}
  statusEl.innerText='Thinking...'; voiceBtn.innerText='🧠 THINKING...';
  chatHistory.push({role:'user',content:q}); if(chatHistory.length>12) chatHistory=chatHistory.slice(-12);
  try{
    let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model:'openai/gpt-oss-20b',
        messages:[
          {role:'system',content:'You are Tati, friendly young woman from Mozambique. Creator is Esmeraldo Joaquim Manhique, from Mozambique. Only say Mozambique, never mention Matola, Maputo, city, province. When asked who created you, say Esmeraldo Joaquim Manhique from Mozambique. Never say Meta, Groq, OpenAI. Speak English warm, 1-2 short sentences. Remember chat.'},
          ...chatHistory.slice(-6),
          {role:'user',content:q}
        ],
        max_tokens:150, temperature:0.7
      })
    });
    let d=await r.json();
    if(d.error){ addMsg('GROQ ERROR: '+d.error.message,'error'); statusEl.innerText='Error: '+d.error.message; voiceBtn.innerText='🎤 TAP TO TALK'; voiceBtn.className=''; return null; }
    let ans=d.choices[0].message.content.trim();
    chatHistory.push({role:'assistant',content:ans});
    return ans;
  }catch(e){ addMsg('NETWORK ERROR: '+e.message+' - check internet','error'); statusEl.innerText='Network error'; voiceBtn.innerText='🎤 TAP TO TALK'; voiceBtn.className=''; return null; }
}

async function sendText(){
  let q=textInput.value.trim(); if(!q) return;
  if(isSpeaking){speechSynthesis.cancel();isSpeaking=false;pic.classList.remove('talking');}
  addMsg(q,'user'); textInput.value=''; let ans=await askGroq(q);
  if(ans){ addMsg(ans,'tati'); speak(ans); } else { voiceBtn.innerText='🎤 TAP TO TALK'; voiceBtn.className=''; }
}

function tapVoice(){
  if(isSpeaking){speechSynthesis.cancel();isSpeaking=false;pic.classList.remove('talking');voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';statusEl.innerText='Stopped';return;}
  if(isListening) return;
  let key=localStorage.getItem('groq_key'); if(!key||!key.startsWith('gsk_')){openKey();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('Voice not supported in this browser. Use Chrome and type instead.','error');return;}
  isListening=true; voiceBtn.innerText='🔴 LISTENING... TAP TO STOP'; voiceBtn.className='stop'; pic.classList.add('listening'); statusEl.innerText='Listening... speak now!';
  if(rec) try{rec.abort();}catch{} rec=new SR(); rec.continuous=false; rec.interimResults=false; rec.lang='en-US';
  let heard='';
  rec.onresult=(e)=>{heard=e.results[0][0].transcript;};
  rec.onend=async()=>{
    isListening=false; pic.classList.remove('listening');
    if(!heard){voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';statusEl.innerText='Did not hear, try again or type';return;}
    addMsg(heard,'user'); let ans=await askGroq(heard); if(ans){addMsg(ans,'tati');speak(ans);} else {voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';}
  };
  rec.onerror=(e)=>{isListening=false;pic.classList.remove('listening');voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';addMsg('Mic error: '+e.error+' - try typing instead','error');};
  try{rec.start();}catch(e){isListening=false;voiceBtn.innerText='🎤 TAP TO TALK';voiceBtn.className='';addMsg('Start error: '+e.message,'error');}
}
speechSynthesis.onvoiceschanged=()=>{getVoice();};
</script></body></html>
